<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Master Dashboard — Wayfinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1120; --navy-2:#101C34; --navy-light:#1D305A;
  --navy-deep:#060A14;
  --gold:#CBA05C; --gold-light:#EAD9AE; --gold-deep:#8E6B34; --gold-glow:rgba(203,160,92,.35);
  --bg:#FAF7F1; --card:#FFFFFF; --text:#221B10; --muted:#8A7C63; --border:#EDE5D3;
  --green:#3E9E72; --yellow:#C08A2E; --red:#C24F4F;
  --shadow:0 1px 2px rgba(10,17,32,.06),0 22px 46px rgba(10,17,32,.11);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',serif}
a{color:inherit;text-decoration:none} button{font-family:inherit;cursor:pointer} input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#DCD9CF;border-radius:10px} ::-webkit-scrollbar-track{background:transparent}

.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.setup-card{max-width:520px;background:#fff;border-radius:18px;padding:36px;box-shadow:var(--shadow);border:1px solid var(--border)}
.setup-card .icon{width:44px;height:44px;border-radius:12px;background:#FCF1DC;color:#8A5A00;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:18px}
.setup-card h2{font-family:'Fraunces',serif;margin:0 0 10px;font-size:22px;color:var(--navy)}
.setup-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}
.setup-card code{background:#F3F1EA;padding:2px 6px;border-radius:5px;font-size:12.5px}

.shell{display:flex;min-height:100vh}
.sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,#080f1f 100%);color:#fff;
  padding:26px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:8px;padding:0 4px}
.brand .mark{width:38px;height:38px;border-radius:10px;border:1.5px solid rgba(233,214,172,.35);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-weight:700;font-size:13px;animation:markSway 4.2s ease-in-out infinite;transform-origin:50% 65%}
@keyframes markSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.brand .name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;letter-spacing:.22em;color:#fff}
.brand .sub{font-size:10.5px;color:rgba(255,255,255,.42)}
.side-divider{height:1px;background:rgba(255,255,255,.08);margin:20px 4px}
.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.32);margin:4px 10px 10px;font-weight:700}
.side-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:rgba(255,255,255,.72);font-size:13.5px;font-weight:600;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.side-link:hover{background:rgba(255,255,255,.07);color:#fff}
.side-link.active{background:rgba(198,161,91,.16);color:var(--gold-light);font-weight:700}
.side-spacer{flex:1}
.side-user{display:flex;align-items:center;gap:10px;padding:12px;border-radius:13px;background:rgba(255,255,255,.05);margin-bottom:8px}
.side-user .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a8813f);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.side-user .n{font-size:12.5px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .r{font-size:10.5px;color:rgba(255,255,255,.45);text-transform:capitalize}
.logout-btn{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.6);font-size:12.5px;font-weight:600;transition:background .15s,color .15s}
.logout-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.side-add-btn{width:100%;padding:11px;border-radius:11px;border:none;margin-bottom:12px;background:linear-gradient(135deg,var(--gold),#a8813f);color:var(--navy);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,box-shadow .15s}
.side-add-btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(198,161,91,.3)}

@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.chart-grid .card:last-child{animation-delay:.26s}
@keyframes rowFlash{0%{background:#FBF3E2}100%{background:transparent}}
.row-flash{animation:rowFlash 1.4s ease-out}
.connection-banner{display:none;align-items:center;justify-content:center;gap:8px;background:#FCEFD8;color:#8A5A00;font-size:13px;font-weight:600;padding:10px;position:sticky;top:0;z-index:200}

.page-head{margin-bottom:28px;padding:8px 0 22px;border-bottom:1px solid rgba(201,161,91,.18)}
.page-head h1{font-family:'Fraunces',serif;margin:0 0 6px;font-size:34px;color:var(--navy);font-weight:600;display:inline-flex;align-items:center;gap:12px;letter-spacing:-.03em}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--green);background:#E4F6EC;padding:5px 11px;border-radius:999px;vertical-align:middle}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:livePulse 1.8s ease-in-out infinite}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(46,158,108,.5)}50%{box-shadow:0 0 0 5px rgba(46,158,108,0)}}
.page-head .muted{margin:0;color:var(--muted);font-size:14.5px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.tyson-note{display:flex;align-items:center;gap:9px;background:#EEF4FC;color:#2C5C93;border:1px solid #D7E5F6;border-radius:11px;padding:11px 15px;font-size:13px;font-weight:600;margin-bottom:22px}
.warn-note{display:flex;align-items:center;gap:9px;background:#FCF1DC;color:#8A5A00;border:1px solid #F4DBA6;border-radius:11px;padding:11px 15px;font-size:13px;font-weight:600;margin-bottom:22px}

.card{background:var(--card);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow);margin-bottom:22px;border:1px solid var(--border)}
.reveal-up{opacity:0;transform:translateY(18px);transition:opacity .55s cubic-bezier(.2,.8,.3,1),transform .55s cubic-bezier(.2,.8,.3,1)}
.reveal-up.revealed{opacity:1;transform:none}
.card h3{margin:0 0 16px;font-size:15.5px;color:var(--navy)}
.card-head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-head-row h3{margin:0}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--border);border-left:4px solid var(--navy-2);transition:transform .18s}
.stat-card:hover{transform:translateY(-2px)}
.stat-card.accent-green{border-left-color:var(--green)} .stat-card.accent-red{border-left-color:var(--red)}
.stat-value{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--navy);line-height:1;letter-spacing:-.03em}
.stat-value{transition:opacity .2s ease}
.stat-label{font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:600}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.chart-card{position:relative;overflow:hidden}
.chart-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--navy-2))}
.chart-card-head h3{margin-bottom:2px}
.chart-canvas-wrap{position:relative;margin-top:8px;height:260px}
.chart-center-label{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.chart-center-label .n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--navy)}
.chart-center-label .l{font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}

/* Fleet hero + pipeline */
.fleet-grid{display:grid;grid-template-columns:1.1fr 1.4fr;gap:22px;margin-bottom:22px}
.fleet-hero{display:flex;align-items:center;gap:24px}
.fleet-ring-wrap{flex-shrink:0}
.fleet-ring{--pct:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--pct)*1%),#EFE9DA 0);display:flex;align-items:center;justify-content:center;position:relative;transition:background 1.2s cubic-bezier(.2,.8,.3,1)}
.fleet-ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff;box-shadow:inset 0 2px 6px rgba(10,17,32,.06)}
.fleet-ring span{position:relative;font-family:'Fraunces',serif;font-weight:600;font-size:27px;color:var(--navy)}
.fleet-ring span small{font-size:14px;font-weight:500}
.fleet-legend{display:flex;flex-direction:column;gap:8px}
.fleet-legend-item{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text)}
.fleet-legend-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.pipeline-list{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.pipeline-row{display:grid;grid-template-columns:70px 1fr 26px;align-items:center;gap:12px}
.pipeline-label{font-size:12px;font-weight:700;color:var(--navy)}
.pipeline-track{height:10px;background:#EFE9DA;border-radius:6px;overflow:hidden}
.pipeline-fill{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.pipeline-count{font-size:13px;font-weight:800;color:var(--navy);text-align:right}

.accent-amber{border-left-color:var(--yellow)}

/* Agent card grid */
.agent-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.agent-card{
  background:#FCFAF5;border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s;text-align:center;
  opacity:0;animation:cardIn .5s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.agent-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(10,17,32,.1);border-color:var(--gold-light)}
.agent-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.agent-card-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.risk-dot{width:9px;height:9px;border-radius:50%;margin-top:4px}
.risk-dot-green{background:var(--green)} .risk-dot-yellow{background:var(--yellow)} .risk-dot-red{background:var(--red)}
.agent-card-ring{--pct:0;width:66px;height:66px;margin:6px auto 10px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--pct)*1%),#EFE9DA 0);display:flex;align-items:center;justify-content:center;position:relative;transition:background .8s ease}
.agent-card-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#FCFAF5}
.agent-card-ring span{position:relative;font-weight:800;font-size:13px;color:var(--navy)}
.agent-card-name{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-card-meta{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.days-chip{font-size:10px;font-weight:700;color:var(--muted);background:#F0EBDD;padding:3px 8px;border-radius:999px}
.overdue-text{color:var(--red);font-weight:700}

/* Activity feed */
.activity-list{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto}
.activity-row{display:flex;gap:11px;padding:10px 4px;border-bottom:1px solid var(--border)}
.activity-row:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot-skalvya{background:var(--navy-2)} .dot-agent{background:var(--gold)}
.activity-text{font-size:12.8px;color:var(--text);line-height:1.4}
.activity-text em{font-style:normal;color:var(--muted)}
.activity-time{font-size:11px;color:var(--muted);margin-top:2px}

.roster-table{width:100%;border-collapse:collapse;font-size:13.5px}
.roster-table th{text-align:left;padding:10px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1.5px solid var(--border);font-weight:800}
.roster-table td{padding:13px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.roster-table tbody tr{cursor:pointer;transition:background .12s}
.roster-table tbody tr:hover{background:#FAF9F5}
.roster-table tbody tr:last-child td{border-bottom:none}
.cell-name{font-weight:700;color:var(--navy)}
.cell-next{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-track{width:100px;height:7px;background:#EEEBE2;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy-2));border-radius:6px;transition:width .5s ease}
.progress-pct{font-size:11.5px;color:var(--muted);margin-left:8px;font-weight:700}
.phase-pill{display:inline-block;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;background:#EFEAE0;color:var(--navy)}
.risk-badge{display:inline-block;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700}
.risk-green{background:#E4F6EC;color:var(--green)} .risk-yellow{background:#FCF1DC;color:var(--yellow)} .risk-red{background:#FBE7E7;color:var(--red)}
.blocker-count{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:0 6px}

.blocker-list{display:flex;flex-direction:column;gap:9px}
.blocker-row{display:grid;grid-template-columns:150px 1fr 1.3fr;gap:14px;padding:11px 13px;background:#FDF6F6;border:1px solid #F5D9D9;border-radius:10px;font-size:13px}
.blocker-agent{font-weight:700;color:var(--navy)} .blocker-task{color:var(--text)} .blocker-text{color:var(--red);font-weight:500}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.error-panel{text-align:center;padding:50px 24px;max-width:460px;margin:0 auto}
.error-panel .icon{width:44px;height:44px;border-radius:12px;background:#FDECEC;color:#B23C3C;display:flex;align-items:center;justify-content:center;font-size:19px;margin:0 auto 16px}
.error-panel h3{font-family:'Fraunces',serif;color:var(--navy);margin:0 0 8px;font-size:18px}
.error-panel .code{font-size:12px;color:#B23C3C;background:#FDECEC;border-radius:7px;padding:6px 10px;display:inline-block;margin:6px 0 14px;font-family:monospace}
.error-panel .hint{font-size:13px;color:var(--muted);line-height:1.6}
.compass-loader{width:78px;height:78px;margin:0 auto 16px;filter:drop-shadow(0 0 18px rgba(198,161,91,.22))}
.cl-ripple{transform-origin:100px 100px;opacity:0;stroke-width:1}
.cl-ripple.r1{animation:clRippleOut 2.3s ease-out infinite}
.cl-ripple.r2{animation:clRippleOut 2.3s ease-out infinite 1.15s}
@keyframes clRippleOut{0%{opacity:.6;transform:scale(.55)}100%{opacity:0;transform:scale(1.3)}}
.cl-needle{transform-origin:100px 100px;animation:clNeedleSearch 2.6s ease-in-out infinite}
@keyframes clNeedleSearch{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.sparkle-star{transform-origin:85px 35px;animation:sparkleTwinkle 2.4s ease-in-out infinite}
.sparkle-dot{transform-origin:40px 48px;animation:sparkleTwinkle 2.8s ease-in-out infinite .3s}
.sparkle-dot2{transform-origin:74px 52px;animation:sparkleTwinkle 3.1s ease-in-out infinite .65s}
@keyframes sparkleTwinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.loading-msg{text-align:center;color:var(--muted);font-size:13.5px;font-weight:500}
.premium-spinner{width:60px;margin:0 auto 18px;position:relative}
.spinner-ring{width:52px;height:52px;margin:0 auto;border-radius:50%;
  border:2.5px solid rgba(198,161,91,.18);border-top-color:#C6A15B;
  animation:spinRing 1s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spinRing{to{transform:rotate(360deg)}}
.spinner-word{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Fraunces',serif;font-size:7px;font-weight:700;letter-spacing:1.4px;color:#C6A15B;
  animation:spinnerPulse 1.8s ease-in-out infinite}
@keyframes spinnerPulse{0%,100%{opacity:.55}50%{opacity:1}}


.modal-overlay{position:fixed;inset:0;background:rgba(10,15,28,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(3px)}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:30px 28px;width:100%;max-width:430px;box-shadow:0 30px 60px rgba(0,0,0,.32);max-height:88vh;overflow-y:auto}
.modal h2{font-family:'Fraunces',serif;margin:0 0 20px;font-size:20px;color:var(--navy);font-weight:600}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:7px;margin-top:15px}
.modal label:first-of-type{margin-top:0}
.modal input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;background:#FBFAF7}
.modal input:focus{outline:none;border-color:var(--gold);background:#fff}
.modal-divider{border:none;border-top:1px dashed var(--border);margin:20px 0 4px}
.modal-hint{font-size:11.5px;color:var(--muted);margin:5px 0 0}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.btn-primary{background:linear-gradient(135deg,var(--navy-2),var(--navy-light));color:#fff;border:none;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,box-shadow .15s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(15,27,51,.24)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--border);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:700}
.btn-secondary:hover{border-color:var(--navy)}

@media (max-width:880px){
  .shell{flex-direction:column} .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:14px 16px}
  .side-spacer,.side-divider,.side-label,.side-add-btn{display:none} .content{padding:20px}
  .stat-grid,.chart-grid,.fleet-grid{grid-template-columns:1fr} .blocker-row{grid-template-columns:1fr}
  .agent-card-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}

.ambient-wave{position:fixed;bottom:0;left:0;width:100%;height:110px;pointer-events:none;z-index:-1;opacity:.05;overflow:hidden}
.ambient-wave svg{width:200%;height:100%}
.ambient-wave .a1{animation:waveMove 22s linear infinite}
.ambient-wave .a2{animation:waveMove 30s linear infinite reverse}

.brand .mark,.brandmark .box{box-shadow:0 0 0 1px rgba(240,220,169,.08),0 12px 30px rgba(0,0,0,.2);}
.brand .mark img,.brandmark .box img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(201,161,91,.28));}
.content{max-width:1380px;position:relative;}
.card,.stat-card{border-color:rgba(197,161,91,.18);box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:transform .24s var(--ease-out),box-shadow .24s var(--ease-out),border-color .24s var(--ease-out);}
.card:hover,.stat-card:hover{transform:translateY(-2px);box-shadow:0 24px 58px rgba(7,17,31,.13);border-color:rgba(197,161,91,.38);}
.page-head h1,.agent-header h1{letter-spacing:-.02em;}
.live-badge{box-shadow:0 0 0 5px rgba(62,158,114,.07);}
.progress-fill,.pipeline-fill,.mini-seg-fill{background:linear-gradient(90deg,#C9A15B 0%,#E4C47E 42%,#153A57 100%);box-shadow:0 0 15px rgba(201,161,91,.22);}
.task-row{background:rgba(255,255,255,.56);transition:transform .22s var(--ease-out),box-shadow .22s var(--ease-out),border-color .22s var(--ease-out);}
.task-row:hover{transform:translateX(3px);border-color:rgba(201,161,91,.5);box-shadow:0 12px 30px rgba(7,17,31,.08);}
.task-row.task-complete{background:linear-gradient(100deg,rgba(232,247,238,.9),rgba(255,255,255,.88));}
.task-complete .task-status-dot{box-shadow:0 0 0 6px rgba(62,158,114,.12);}
.help-link{position:relative;overflow:hidden;}
.help-link::after{content:"";position:absolute;inset:0;transform:translateX(-110%);background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transition:transform .5s var(--ease-out);}
.help-link:hover::after{transform:translateX(110%);}
.fleet-hero,.chart-card,.agent-card{position:relative;overflow:hidden;}
.fleet-hero::after,.chart-card::after,.agent-card::after{content:"";position:absolute;inset:auto -30% -70% 20%;height:120px;background:radial-gradient(ellipse,rgba(201,161,91,.12),transparent 65%);pointer-events:none;}
.agent-card{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(248,244,234,.82));}
.agent-card-ring,.fleet-ring,.ring{filter:drop-shadow(0 8px 18px rgba(201,161,91,.14));}
.reveal-up{transition-duration:.72s;}
@media (prefers-reduced-motion:no-preference){
  .sidebar::after{animation:seaDrift 18s ease-in-out infinite alternate;}
  .card::before,.stat-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.36) 48%,transparent 72%);transform:translateX(-120%);opacity:0;transition:opacity .2s;}
  .card:hover::before,.stat-card:hover::before{opacity:1;animation:sheen 1.1s var(--ease-out);}
}
@keyframes seaDrift{from{transform:translate3d(-4%,0,0) scale(1.04)}to{transform:translate3d(4%,-5px,0) scale(1.08)}}
@keyframes sheen{to{transform:translateX(120%)}}
@media (max-width:880px){.sidebar::after{display:none}.content{padding:24px 18px 54px}.stat-grid{grid-template-columns:repeat(2,1fr)}.chart-grid,.fleet-grid{grid-template-columns:1fr}}
@media (max-width:560px){.stat-grid{grid-template-columns:1fr}.agent-header{align-items:flex-start}.agent-header-side{width:100%;justify-content:space-between}.card{padding:20px 17px}}


/* Master command pulse: a compact, live signal that reinforces real-time synchronization. */
.command-pulse{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:9px 13px;border:1px solid rgba(201,161,91,.24);border-radius:999px;background:rgba(255,255,255,.66);font-size:11.5px;color:var(--muted);box-shadow:0 8px 24px rgba(7,17,31,.05)}
.command-pulse strong{color:var(--navy)}
.pulse-wave{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(62,158,114,.35);animation:livePulse 1.8s ease-in-out infinite}

/* Tideborne Command visual system: warm brass direction, deep-water depth, motion only where it communicates progress. */
:root{--gold:#C9A15B;--gold-light:#F0DCA9;--gold-deep:#8C6B37;--navy:#07111F;--navy-2:#10233D;--navy-light:#1C3B58;--bg:#F4F1EA;--card:rgba(255,255,255,.94);--border:rgba(197,161,91,.22);--shadow:0 18px 50px rgba(7,17,31,.10);--ease-out:cubic-bezier(.23,1,.32,1);}
body{background:linear-gradient(180deg,#F8F6F0 0%,#F1EEE7 100%);}

.brand .mark,.brandmark .box{box-shadow:0 0 0 1px rgba(240,220,169,.08),0 12px 30px rgba(0,0,0,.2);}
.brand .mark img,.brandmark .box img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(201,161,91,.28));}
.content{max-width:1380px;position:relative;}
.card,.stat-card{border-color:rgba(197,161,91,.18);box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:transform .24s var(--ease-out),box-shadow .24s var(--ease-out),border-color .24s var(--ease-out);}
.card:hover,.stat-card:hover{transform:translateY(-2px);box-shadow:0 24px 58px rgba(7,17,31,.13);border-color:rgba(197,161,91,.38);}
.page-head h1,.agent-header h1{letter-spacing:-.02em;}
.live-badge{box-shadow:0 0 0 5px rgba(62,158,114,.07);}
.progress-fill,.pipeline-fill,.mini-seg-fill{background:linear-gradient(90deg,#C9A15B 0%,#E4C47E 42%,#153A57 100%);box-shadow:0 0 15px rgba(201,161,91,.22);}
.task-row{background:rgba(255,255,255,.56);transition:transform .22s var(--ease-out),box-shadow .22s var(--ease-out),border-color .22s var(--ease-out);}
.task-row:hover{transform:translateX(3px);border-color:rgba(201,161,91,.5);box-shadow:0 12px 30px rgba(7,17,31,.08);}
.task-row.task-complete{background:linear-gradient(100deg,rgba(232,247,238,.9),rgba(255,255,255,.88));}
.task-complete .task-status-dot{box-shadow:0 0 0 6px rgba(62,158,114,.12);}
.help-link{position:relative;overflow:hidden;}
.help-link::after{content:"";position:absolute;inset:0;transform:translateX(-110%);background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transition:transform .5s var(--ease-out);}
.help-link:hover::after{transform:translateX(110%);}
.fleet-hero,.chart-card,.agent-card{position:relative;overflow:hidden;}
.fleet-hero::after,.chart-card::after,.agent-card::after{content:"";position:absolute;inset:auto -30% -70% 20%;height:120px;background:radial-gradient(ellipse,rgba(201,161,91,.12),transparent 65%);pointer-events:none;}
.agent-card{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(248,244,234,.82));}
.agent-card-ring,.fleet-ring,.ring{filter:drop-shadow(0 8px 18px rgba(201,161,91,.14));}
.reveal-up{transition-duration:.72s;}
@media (prefers-reduced-motion:no-preference){
  .sidebar::after{animation:seaDrift 18s ease-in-out infinite alternate;}
  .card::before,.stat-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.36) 48%,transparent 72%);transform:translateX(-120%);opacity:0;transition:opacity .2s;}
  .card:hover::before,.stat-card:hover::before{opacity:1;animation:sheen 1.1s var(--ease-out);}
}
@keyframes seaDrift{from{transform:translate3d(-4%,0,0) scale(1.04)}to{transform:translate3d(4%,-5px,0) scale(1.08)}}
@keyframes sheen{to{transform:translateX(120%)}}
@media (max-width:880px){.sidebar::after{display:none}.content{padding:24px 18px 54px}.stat-grid{grid-template-columns:repeat(2,1fr)}.chart-grid,.fleet-grid{grid-template-columns:1fr}}

  const OWNER_COLORS = { Agent: "#CBA05C", Skalvya: "#101C34", Shared: "#5E7C8C" };
  const RISK_LABELS = { green: "On Track", yellow: "At Risk", red: "Blocked" };
  function isTaskComplete(t){ return t.subtasks.length>0 && t.subtasks.every(s=>s.done); }
  function taskProgress(t){ const total=t.subtasks.length||1; return t.subtasks.filter(s=>s.done).length/total; }
  function overallProgress(tasks){ if(!tasks||tasks.length===0) return 0; const total=tasks.reduce((a,t)=>a+(t.subtasks||[]).length,0); const done=tasks.reduce((a,t)=>a+(t.subtasks||[]).filter(s=>s.done).length,0); return total ? done/total : 0; }
  function currentPhase(tasks){ for(const p of PHASES){ const pt=tasks.filter(t=>t.phase===p.id); if(pt.length && !pt.every(isTaskComplete)) return p; } return PHASES[PHASES.length-1]; }
  function openBlockers(tasks){ return tasks.filter(t=>t.blocker && t.blocker.trim()!=="" && !isTaskComplete(t)); }
  function daysUntil(iso){
    if (!iso) return null;
    const target = new Date(iso+"T00:00:00");
    const diff = Math.ceil((target - new Date()) / (1000*60*60*24));
    return diff;
  }
  function phasePipelineCounts(){
    const counts = {}; PHASES.forEach(p => counts[p.id] = 0);
    agents.forEach(a => { const p = currentPhase(tasksByAgent[a.id] || []); counts[p.id] = (counts[p.id]||0) + 1; });
    return counts;
  }
  function relativeTime(iso){
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs/60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.floor(mins/60);
    if (hrs < 24) return hrs + "h ago";
    return Math.floor(hrs/24) + "d ago";
  }
  function recentActivity(limit){
    const items = [];
    Object.entries(tasksByAgent).forEach(([agentId, tasks]) => {
      const agent = agents.find(a => a.id === agentId);
      if (!agent) return;
      tasks.forEach(t => {
        if (t.lastEditedBy && t.lastEditedBy.at) {
          items.push({ agentName: agent.name, taskTitle: t.title, by: t.lastEditedBy.name, role: t.lastEditedBy.role, at: t.lastEditedBy.at });
        }
      });
    });
    items.sort((a,b) => new Date(b.at) - new Date(a.at));
    return items.slice(0, limit);
  }
  function nextAction(tasks){ const open=tasks.filter(t=>!isTaskComplete(t)); const withNext=open.find(t=>t.nextAction && t.nextAction.trim()!==""); return withNext?withNext.nextAction:(open[0]?open[0].title:"All tasks complete"); }
  function formatDate(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
  function initials(name){ return (name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }

      const knownRole = ["skalvya", "agent", "tyson"].includes(data.role);
      me = { uid: user.uid, name: data.name, agentId: data.agentId, role: knownRole ? data.role : "tyson" };
      me.roleUnknown = !knownRole;
      if (me.role === "agent") { window.location.href = "agent.html"; return; }

  function closeModal() {
    document.getElementById("addAgentModal").classList.remove("open");
    document.getElementById("addAgentForm").reset();
  }

  function listenToAgents() {
    db.collection("agents").orderBy("startDate", "desc").onSnapshot((snap) => {
      agents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      agents.forEach(a => {
        if (!taskUnsubs[a.id]) {
          taskUnsubs[a.id] = db.collection("agents").doc(a.id).collection("tasks").onSnapshot((tsnap) => {
            tasksByAgent[a.id] = tsnap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
          }, handleErr);
        }
      });
      render();
    }, handleErr);
  }
  function animateCounts() {
    document.querySelectorAll("[data-count]").forEach(el => {
      const target = parseInt(el.dataset.count, 10) || 0;
      const suffix = el.dataset.suffix || "";
      const duration = 700;
      const start = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(eased * target) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  function handleErr(err){
    console.error(err);
    const banner = document.getElementById("connectionBanner");
    banner.style.display = "flex";
    banner.textContent = "Can't reach the database — " + (err.code || "unknown error");
    const main = document.getElementById("main");
    if (!main) return;
    main.innerHTML = `<div class="error-panel">
      <div class="icon">&#9888;</div>
      <h3>Couldn't load the dashboard</h3>
      <div class="code">${err.code || "unknown"}</div>
      <p class="hint">${err.message || String(err)}</p>
      <p class="hint" style="margin-top:14px;">Most common cause: Firestore security rules aren't published yet, or your account's <code>role</code> field doesn't exactly match "skalvya" or "tyson" (check for capitalization or extra spaces in the Firestore console).</p>
    </div>`;
  }

  async function submitAddAgent(e) {
    e.preventDefault();
    const btn = document.getElementById("createAgentBtn");
    btn.disabled = true; btn.textContent = "Creating...";
    const name = document.getElementById("agentNameInput").value.trim();
    const startDate = document.getElementById("agentStartInput").value;
    const targetDate = document.getElementById("agentTargetInput").value;
    const email = document.getElementById("agentEmailInput").value.trim();
    const password = document.getElementById("agentPasswordInput").value;
    try {
      const agentRef = await db.collection("agents").add({ name, startDate, targetDate, riskStatus: "green", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      const batch = db.batch();
      buildTaskInstances().forEach(task => batch.set(agentRef.collection("tasks").doc(task.id), task));
      await batch.commit();
      if (email && password) await createAgentLogin(email, password, name, agentRef.id);
      closeModal();
    } catch (err) {
      console.error(err); alert("Something went wrong creating this agent.");
    } finally {
      btn.disabled = false; btn.textContent = "Create Agent";
    }
  }

  async function createAgentLogin(email, password, name, agentId) {
    const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary-" + Date.now());
    try {
      const secondaryAuth = secondaryApp.auth();
      const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
      await db.collection("users").doc(cred.user.uid).set({ role: "agent", agentId, name, email });
      await secondaryAuth.signOut();
    } finally {
      await secondaryApp.delete();
    }
  }

  function patchData() {
    const totalAgents = agents.length;
    const overallPct = totalAgents === 0 ? 0 : agents.reduce((acc, a) => acc + overallProgress(tasksByAgent[a.id] || []), 0) / totalAgents;
    const onTrack = agents.filter(a => a.riskStatus === "green").length;
    const atRisk = agents.filter(a => a.riskStatus === "yellow").length;
    const blocked = agents.filter(a => a.riskStatus === "red").length;
    const pipeline = phasePipelineCounts();
    const activity = recentActivity(8);
    const pctInt = Math.round(overallPct * 100);

    const fleetRing = document.getElementById("fleetRing");
    if (fleetRing) { fleetRing.style.setProperty("--pct", pctInt); document.getElementById("fleetRingVal").innerHTML = pctInt + "<small>%</small>"; }
    setText("legendOnTrack", onTrack); setText("legendAtRisk", atRisk); setText("legendBlocked", blocked);

    PHASES.forEach(p => {
      const count = pipeline[p.id] || 0;
      const pct = totalAgents === 0 ? 0 : Math.round((count/totalAgents)*100);
      const fill = document.getElementById("pipelineFill-" + p.id);
      if (fill) fill.style.width = pct + "%";
      setText("pipelineCount-" + p.id, count);
    });

    patchStat("statTotal", totalAgents);
    patchStat("statOnTrack", onTrack);
    patchStat("statAtRisk", atRisk);
    patchStat("statBlocked", blocked);

    try { updateOwnerChart(); } catch (e) { console.error("Owner chart failed:", e); }
    try { updatePhaseChart(); } catch (e) { console.error("Phase chart failed:", e); }

    const agentCardsEl = document.getElementById("agentCardsContainer");
    if (agentCardsEl) agentCardsEl.innerHTML = renderAgentCards();
    const activityEl = document.getElementById("activityFeedContainer");
    if (activityEl) activityEl.innerHTML = renderActivityFeed(activity);
    const rosterEl = document.getElementById("rosterTableContainer");
    if (rosterEl) rosterEl.innerHTML = renderRosterTable();

    // Flash any row whose progress just changed — confirms live sync at a glance
    agents.forEach(agent => {
      const pct = Math.round(overallProgress(tasksByAgent[agent.id] || []) * 100);
      if (prevProgress[agent.id] !== undefined && prevProgress[agent.id] !== pct) {
        document.querySelectorAll(`[data-open-agent="${agent.id}"]`).forEach(el => {
          el.classList.add("row-flash");
          setTimeout(() => el.classList.remove("row-flash"), 900);
        });
      }
      prevProgress[agent.id] = pct;
    });
    setupScrollReveal();
  }

  function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }
  function patchStat(id, val) {
    const el = document.getElementById(id);
    if (!el) return;
    const from = parseInt(el.dataset.count || "0", 10);
    el.dataset.count = val;
    if (from === val) { el.textContent = val; return; }
    animateNumber(el, from, val);
  }
  function animateNumber(el, from, to) {
    const dur = 500, start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function setupScrollReveal() {
    const els = document.querySelectorAll(".reveal-up:not(.revealed)");
    if (!("IntersectionObserver" in window)) { els.forEach(el => el.classList.add("revealed")); return; }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add("revealed"); obs.unobserve(entry.target); } });
    }, { threshold: 0.08 });
    els.forEach(el => obs.observe(el));
  }

  function renderAgentCards(){
    if (agents.length === 0) return `<p class="muted">No agents added yet.${me.role==="skalvya" ? ' Use "+ Add Agent" to start tracking someone.' : ""}</p>`;
    return `<div class="agent-card-grid">${agents.map((agent, i) => {
      const tasks = tasksByAgent[agent.id] || [];
      const pct = Math.round(overallProgress(tasks)*100);
      const phase = currentPhase(tasks);
      const risk = agent.riskStatus || "green";
      const days = daysUntil(agent.targetDate);
      return `<div class="agent-card" onclick="window.location.href='agent.html?agentId=${agent.id}'" data-open-agent="${agent.id}" style="animation-delay:${i*45}ms; cursor:pointer;">
        <div class="agent-card-top">
          <div class="agent-card-avatar">${initials(agent.name)}</div>
          <span class="risk-dot risk-dot-${risk}"></span>
        </div>
        <div class="agent-card-ring" style="--pct:${pct}"><span>${pct}%</span></div>
        <div class="agent-card-name">${agent.name}</div>
        <div class="agent-card-meta"><span class="phase-pill">Phase ${phase.id}</span>${days !== null ? `<span class="days-chip">${days >= 0 ? days + "d left" : "overdue"}</span>` : ""}</div>
      </div>`;
    }).join("")}</div>`;
  }

  function renderActivityFeed(items){
    if (items.length === 0) return `<p class="muted">No activity yet — updates will show up here the moment anyone checks something off.</p>`;
    return `<div class="activity-list">${items.map(it => `
      <div class="activity-row">
        <div class="activity-dot ${it.role === "skalvya" ? "dot-skalvya" : "dot-agent"}"></div>
        <div class="activity-body">
          <div class="activity-text"><strong>${escapeHtmlLite(it.by || it.role)}</strong> updated <em>${escapeHtmlLite(it.taskTitle)}</em> for ${escapeHtmlLite(it.agentName)}</div>
          <div class="activity-time">${relativeTime(it.at)}</div>
        </div>
      </div>`).join("")}</div>`;
  }
  function escapeHtmlLite(s){ return (s||"").replace(/</g,"&lt;"); }

  function renderRosterTable() {
    if (agents.length === 0) return `<p class="muted">No agents added yet.${me.role==="skalvya" ? ' Use "+ Add Agent" to start tracking someone.' : ""}</p>`;
    const rows = agents.map(agent => {
      const tasks = tasksByAgent[agent.id] || [];
      const pct = Math.round(overallProgress(tasks)*100);
      const phase = currentPhase(tasks);
      const risk = agent.riskStatus || "green";
      const days = daysUntil(agent.targetDate);
      return `<tr onclick="window.location.href='agent.html?agentId=${agent.id}'" data-open-agent="${agent.id}" style="cursor:pointer;">
        <td class="cell-name">${agent.name}</td>
        <td>${formatDate(agent.startDate)}</td>
        <td>${formatDate(agent.targetDate)}</td>
        <td><span class="phase-pill">Phase ${phase.id}</span></td>
        <td><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-pct">${pct}%</span></td>
        <td><span class="risk-badge risk-${risk}">${RISK_LABELS[risk]}</span></td>
        <td>${days === null ? "—" : (days >= 0 ? days + "d" : `<span class="overdue-text">${Math.abs(days)}d over</span>`)}</td>
        <td class="cell-next">${nextAction(tasks)}</td>
      </tr>`;
    }).join("");
    return `<table class="roster-table"><thead><tr><th>Agent</th><th>Start Date</th><th>Target Transfer</th><th>Phase</th><th>Progress</th><th>Risk</th><th>Days Left</th><th>Current Task</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function initCharts(retriesLeft) {
    if (retriesLeft === undefined) retriesLeft = 10;
    if (typeof Chart === "undefined") {
      if (retriesLeft > 0) { setTimeout(() => initCharts(retriesLeft - 1), 200); return; }
      console.error("Chart.js never loaded — charts will stay empty.");
      return;
    }
    const ownerCtx = document.getElementById("ownerChart");
    const phaseCtx = document.getElementById("phaseChart");
    if (ownerChart) { try { ownerChart.destroy(); } catch(e){} }
    if (phaseChart) { try { phaseChart.destroy(); } catch(e){} }
    if (ownerCtx) {
      ownerChart = new Chart(ownerCtx, { type:"doughnut",
        data:{ labels:["Agent","Skalvya","Shared"], datasets:[{ data:[0,0,0], backgroundColor:[OWNER_COLORS.Agent,OWNER_COLORS.Skalvya,OWNER_COLORS.Shared], borderWidth:0, hoverOffset:6 }] },
        options:{ responsive:true, maintainAspectRatio:false, animation:{ duration:700, easing:"easeOutQuart" },
          plugins:{ legend:{ position:"bottom", labels:{ font:{ family:"Inter", size:12 }, padding:14, usePointStyle:true, pointStyle:"circle" } },
            tooltip:{ backgroundColor:"#101C34", padding:10, cornerRadius:8, titleFont:{ family:"Inter", weight:"700" }, bodyFont:{ family:"Inter" } } },
          cutout:"70%" } });
    }
    if (phaseCtx) {
      const gradient = phaseCtx.getContext("2d").createLinearGradient(0, 0, 0, 240);
      gradient.addColorStop(0, "#D9B879");
      gradient.addColorStop(1, "#A67F3F");
      phaseChart = new Chart(phaseCtx, { type:"bar",
        data:{ labels:PHASES.map(p=>"Phase "+p.id), datasets:[{ data:[0,0,0,0], backgroundColor:gradient, borderRadius:8, maxBarThickness:52 }] },
        options:{ responsive:true, maintainAspectRatio:false, animation:{ duration:700, easing:"easeOutQuart" },
          plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:"#101C34", padding:10, cornerRadius:8, callbacks:{ label:(c)=>c.parsed.y+"% complete" } } },
          scales:{ y:{ beginAtZero:true, max:100, grid:{ color:"#EFEBE0" }, ticks:{ callback:v=>v+"%", font:{ family:"Inter" } } },
                   x:{ grid:{ display:false }, ticks:{ font:{ family:"Inter", weight:"600" } } } } } });
    }
    // Charts may have been created after the first patchData() call ran — populate them now.
    updateOwnerChart();
    updatePhaseChart();
  }

  function updateOwnerChart() {
    if (!ownerChart) return;
    const totals = { Agent:[0,0], Skalvya:[0,0], Shared:[0,0] };
    Object.values(tasksByAgent).flat().forEach(t => { const subs=t.subtasks||[]; totals[t.owner][1]+=subs.length; totals[t.owner][0]+=subs.filter(s=>s.done).length; });
    const dataVals = [totals.Agent[0],totals.Skalvya[0],totals.Shared[0]];
    const totalDone = dataVals.reduce((a,b)=>a+b,0);
    const totalAll = totals.Agent[1]+totals.Skalvya[1]+totals.Shared[1];
    const centerPct = totalAll === 0 ? 0 : Math.round((totalDone/totalAll)*100);
    const centerLabel = document.getElementById("ownerCenterLabel");
    if (centerLabel) centerLabel.querySelector(".n").textContent = centerPct + "%";
    ownerChart.data.datasets[0].data = dataVals;
    ownerChart.update();
  }

  function updatePhaseChart() {
    if (!phaseChart) return;
    const totals = {}; PHASES.forEach(p => totals[p.id]=[0,0]);
    Object.values(tasksByAgent).flat().forEach(t => { const subs=t.subtasks||[]; totals[t.phase][1]+=subs.length; totals[t.phase][0]+=subs.filter(s=>s.done).length; });
    const pct = PHASES.map(p => { const phaseTasks=Object.values(tasksByAgent).flat().filter(t=>t.phase===p.id); return phaseTasks.length===0?0:Math.round(overallProgress(phaseTasks)*100); });
    phaseChart.data.datasets[0].data = pct;
    phaseChart.update();
  }
}
</script>
