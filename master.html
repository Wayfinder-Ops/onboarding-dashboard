<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Master Dashboard — Wayfinder Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="connectionBanner" class="connection-banner">
    Can't reach the database — check your connection or Firebase config.
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">WF</div>
        <div>
          <div class="name">WAYFINDER</div>
          <div class="sub">Master Dashboard</div>
        </div>
      </div>

      <div class="side-section-label">Overview</div>
      <button class="side-link active" id="navOverview"><span class="dot"></span> All Agents</button>

      <div class="sidebar-spacer"></div>

      <div id="addAgentWrap" style="display:none; margin-bottom:10px;">
        <button class="btn-primary" id="addAgentBtn" style="width:100%; justify-content:center;">+ Add Agent</button>
      </div>

      <div class="side-user">
        <div class="avatar" id="avatarInitials">--</div>
        <div class="who">
          <div class="n" id="userName">Loading...</div>
          <div class="r" id="userRole">—</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </aside>

    <main class="content" id="main">
      <div class="empty-state">Loading dashboard...</div>
    </main>
  </div>

  <!-- Add Agent Modal -->
  <div id="addAgentModal" class="modal-overlay">
    <div class="modal">
      <h2>Add New Agent</h2>
      <form id="addAgentForm">
        <label>Agent Name</label>
        <input type="text" id="agentNameInput" required placeholder="Jane Smith" />

        <label>Start Date</label>
        <input type="date" id="agentStartInput" required />

        <label>Target Transfer Date</label>
        <input type="date" id="agentTargetInput" required />

        <hr class="modal-divider" />
        <label>Login Email (optional — creates their account now)</label>
        <input type="email" id="agentEmailInput" placeholder="jane@example.com" />

        <label>Temporary Password</label>
        <input type="text" id="agentPasswordInput" placeholder="At least 6 characters" />
        <p class="modal-hint">Leave blank to just create the agent record — you can set up their login later.</p>

        <div class="modal-actions">
          <button type="button" id="cancelAddAgent" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary" id="createAgentBtn">Create Agent</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/task-template.js"></script>
  <script src="js/common.js"></script>
  <script src="js/master.js"></script>
</body>
</html>
