<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Onboarding Dashboard - Wayfinder</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Clickable row hover styles keeping original color scheme */
    .clickable-row {
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }
    .clickable-row:hover {
      background-color: #f8fafc !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-slate-900 text-white p-2 rounded-lg">
          <i class="fa-solid fa-compass text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-slate-900">Wayfinder Onboarding</h1>
          <p class="text-xs text-slate-500">Internal Team & Administrative Master View</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-4">
        <span id="user-display" class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
          <i class="fa-regular fa-user mr-1.5"></i> Loading user...
        </span>
        <button id="logout-btn" class="text-sm text-slate-600 hover:text-slate-900 font-medium px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Log Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- Top Stats Overview -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Agents</p>
          <h3 id="stat-total-agents" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-slate-100 text-slate-700 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-users"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">In Progress</p>
          <h3 id="stat-in-progress" class="text-2xl font-bold text-blue-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-spinner"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Completed</p>
          <h3 id="stat-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Blocked / Risks</p>
          <h3 id="stat-blocked" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
      </div>
    </div>

    <!-- Agent Roster Section -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="p-5 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h2 class="text-lg font-bold text-slate-800">Agent Roster</h2>
          <p class="text-sm text-slate-500">Click on any agent's row to view their work checklist.</p>
        </div>
        <button id="open-add-modal-btn" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> Add New Agent
        </button>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">
              <th class="py-3.5 px-4">Agent Name</th>
              <th class="py-3.5 px-4">Email</th>
              <th class="py-3.5 px-4">Status</th>
              <th class="py-3.5 px-4 w-48">Progress</th>
              <th class="py-3.5 px-4 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="agent-table-body" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="5" class="py-8 text-center text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
                <p>Loading agent roster...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Agent Modal -->
  <div id="add-agent-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full overflow-hidden border border-slate-200">
      <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
        <h3 class="font-bold text-slate-800">Add New Agent</h3>
        <button id="close-add-modal-btn" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="add-agent-form" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Agent Name</label>
          <input type="text" id="new-agent-name" required placeholder="e.g., Jane Doe" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email Address</label>
          <input type="email" id="new-agent-email" required placeholder="e.g., jane@example.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>
        <div class="pt-2 flex justify-end space-x-3">
          <button type="button" id="cancel-add-modal-btn" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-sm font-medium shadow-sm">Save Agent</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDRWQYxeV2Hkize1Py7O4D-h2Av14sqMj4",
      authDomain: "wayfinder-onboarding.firebaseapp.com",
      databaseURL: "https://wayfinder-onboarding-default-rtdb.firebaseio.com",
      projectId: "wayfinder-onboarding",
      storageBucket: "wayfinder-onboarding.firebasestorage.app",
      messagingSenderId: "105454511155",
      appId: "1:105454511155:web:1cdc4b1294c7557fb46f46",
      measurementId: "G-F2NWFG505B"
    };

    // Initialize
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Elements
    const userDisplay = document.getElementById("user-display");
    const logoutBtn = document.getElementById("logout-btn");
    const tableBody = document.getElementById("agent-table-body");
    
    // Modals
    const addModal = document.getElementById("add-agent-modal");
    const openAddModalBtn = document.getElementById("open-add-modal-btn");
    const closeAddModalBtn = document.getElementById("close-add-modal-btn");
    const cancelAddModalBtn = document.getElementById("cancel-add-modal-btn");
    const addAgentForm = document.getElementById("add-agent-form");

    // Stats Elements
    const statTotal = document.getElementById("stat-total-agents");
    const statInProgress = document.getElementById("stat-in-progress");
    const statCompleted = document.getElementById("stat-completed");
    const statBlocked = document.getElementById("stat-blocked");

    // Auth Check
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userDisplay.innerHTML = `<i class="fa-regular fa-user mr-1.5"></i> ${user.email}`;
        loadAgents();
      } else {
        window.location.href = "login.html";
      }
    });

    // Logout
    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    });

    // Modal Handlers
    openAddModalBtn.addEventListener("click", () => addModal.classList.remove("hidden"), addModal.classList.add("flex"));
    const closeModal = () => addModal.classList.add("hidden");
    closeAddModalBtn.addEventListener("click", closeModal);
    cancelAddModalBtn.addEventListener("click", closeModal);

    // Add Agent Form Submit
    addAgentForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("new-agent-name").value.trim();
      const email = document.getElementById("new-agent-email").value.trim();

      if (!name || !email) return;

      try {
        await addDoc(collection(db, "agents"), {
          name: name,
          email: email,
          status: "In Progress",
          progress: 0,
          createdAt: serverTimestamp()
        });
        addAgentForm.reset();
        closeModal();
      } catch (err) {
        console.error("Error adding agent:", err);
        alert("Failed to add agent. Check database permissions.");
      }
    });

    // Load Realtime Roster & Attach Click Navigators
    function loadAgents() {
      onSnapshot(collection(db, "agents"), (snapshot) => {
        let agents = [];
        let total = 0;
        let inProgress = 0;
        let completed = 0;
        let blocked = 0;

        snapshot.forEach((doc) => {
          const data = doc.data();
          agents.push({ id: doc.id, ...data });

          total++;
          if (data.status === "Completed" || data.progress === 100) completed++;
          else if (data.status === "Blocked" || data.status === "Risk") blocked++;
          else inProgress++;
        });

        // Update Stats
        statTotal.textContent = total;
        statInProgress.textContent = inProgress;
        statCompleted.textContent = completed;
        statBlocked.textContent = blocked;

        // Render Table
        if (agents.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="5" class="py-8 text-center text-slate-400">
                No agents found. Click "Add New Agent" above to create one.
              </td>
            </tr>`;
          return;
        }

        tableBody.innerHTML = agents.map((agent) => {
          const progressVal = agent.progress || 0;
          return `
            <tr class="clickable-row hover:bg-slate-50 transition border-b border-slate-100" data-id="${agent.id}">
              <td class="py-4 px-4 font-semibold text-slate-800">
                <i class="fa-solid fa-user-circle text-slate-400 mr-2"></i>${agent.name || 'Unnamed Agent'}
              </td>
              <td class="py-4 px-4 text-slate-500">${agent.email || 'N/A'}</td>
              <td class="py-4 px-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
                  agent.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' :
                  agent.status === 'Blocked' ? 'bg-amber-100 text-amber-800' :
                  'bg-blue-100 text-blue-800'
                }">
                  ${agent.status || 'In Progress'}
                </span>
              </td>
              <td class="py-4 px-4">
                <div class="flex items-center gap-3">
                  <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div class="bg-slate-800 h-2 rounded-full" style="width: ${progressVal}%"></div>
                  </div>
                  <span class="text-xs text-slate-500 font-medium">${progressVal}%</span>
                </div>
              </td>
              <td class="py-4 px-4 text-right">
                <button class="text-slate-700 hover:text-slate-900 font-medium text-sm flex items-center justify-end gap-1 ml-auto">
                  Open Checklist <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
              </td>
            </tr>
          `;
        }).join('');

        // Attach click listener to each agent row
        document.querySelectorAll('.clickable-row').forEach((row) => {
          row.addEventListener('click', () => {
            const agentId = row.getAttribute('data-id');
            if (agentId) {
              window.location.href = `agent.html?agentId=${agentId}`;
            }
          });
        });

      }, (error) => {
        console.error("Firestore Error:", error);
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-red-500">
              Error loading data. Make sure you are logged in and security rules permit access.
            </td>
          </tr>`;
      });
    }
  </script>
</body>
</html>
