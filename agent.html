<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Checklist — Wayfinder Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="connectionBanner" class="connection-banner">
    Can't reach the database — check your connection or Firebase config.
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">WF</div>
        <div>
          <div class="name">WAYFINDER</div>
          <div class="sub">Onboarding Ops</div>
        </div>
      </div>

      <div id="skalvyaNav" style="display:none;">
        <div class="side-section-label">Navigate</div>
        <button class="side-link" id="toMasterBtn"><span class="dot"></span> Master Dashboard</button>
      </div>

      <div class="sidebar-spacer"></div>

      <div class="side-user">
        <div class="avatar" id="avatarInitials">--</div>
        <div class="who">
          <div class="n" id="userName">Loading...</div>
          <div class="r" id="userRole">—</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </aside>

    <main class="content" id="main">
      <div class="empty-state">Loading your checklist...</div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/task-template.js"></script>
  <script src="js/common.js"></script>
  <script src="js/agent.js"></script>
</body>
</html>
