<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Wayfinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1120; --navy-2:#101C34; --navy-light:#1D305A;
  --navy-deep:#060A14;
  --gold:#CBA05C; --gold-light:#EAD9AE; --gold-deep:#8E6B34; --gold-glow:rgba(203,160,92,.35);
  --bg:#FAF7F1; --card:#FFFFFF; --text:#221B10; --muted:#8A7C63; --border:#EDE5D3;
  --green:#3E9E72; --yellow:#C08A2E; --red:#C24F4F;
  --shadow:0 1px 2px rgba(10,17,32,.06),0 22px 46px rgba(10,17,32,.11);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',serif}

.wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
@media (max-width:880px){.wrap{grid-template-columns:1fr}.panel-left{display:none}}

.panel-left{
  position:relative;overflow:hidden;
  background:radial-gradient(120% 120% at 15% 10%, #1a2c52 0%, #0e1930 55%, #070d1c 100%);
  padding:56px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
}
.panel-left::before{
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 80% 20%, rgba(198,161,91,.18), transparent 45%),
                    radial-gradient(circle at 20% 85%, rgba(198,161,91,.12), transparent 50%);
}
.panel-left .top{position:relative;z-index:1}
.brandmark{display:flex;align-items:center;gap:12px;margin-bottom:64px}
.brandmark .box{
  width:42px;height:42px;border-radius:11px;border:1.5px solid rgba(233,214,172,.4);
  display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-weight:700;font-size:14px;letter-spacing:.5px;
  background:rgba(255,255,255,.04);animation:markSway 4.2s ease-in-out infinite;transform-origin:50% 65%;
}
@keyframes markSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.brandmark .word{font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:.28em;color:#fff;text-shadow:0 4px 18px rgba(201,161,91,.2)}
.panel-left h1{
  font-family:'Fraunces',serif;font-weight:600;font-size:40px;line-height:1.18;margin:0 0 20px;
  max-width:420px;color:#fff;position:relative;z-index:1;
}
.panel-left h1 em{color:var(--gold-light);font-style:italic}
.panel-left p{color:rgba(255,255,255,.6);font-size:15px;line-height:1.6;max-width:380px;position:relative;z-index:1}
.panel-left .bottom{position:relative;z-index:1;display:flex;gap:28px;flex-wrap:wrap}
.login-route-note{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin:36px 0 22px;color:rgba(255,255,255,.58);font-size:12px}.route-line{width:46px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.stat{}
.stat .n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold-light)}
.stat .l{font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.3px;margin-top:2px}

.panel-right{display:flex;align-items:center;justify-content:center;padding:32px;position:relative;background:radial-gradient(circle at 78% 18%,rgba(201,161,91,.12),transparent 28%),linear-gradient(180deg,#F8F5EE,#F1EEE7)}
.panel-right::before{content:"";position:absolute;inset:32px;pointer-events:none;border:1px solid rgba(201,161,91,.16);clip-path:polygon(0 0,100% 0,100% 1px,1px 1px,1px 100%,0 100%);opacity:.8}
.form-card{width:100%;max-width:420px;padding:38px 36px 34px;border:1px solid rgba(201,161,91,.18);border-radius:24px;background:rgba(255,255,255,.56);box-shadow:0 24px 70px rgba(7,17,31,.08),inset 0 1px 0 rgba(255,255,255,.85);backdrop-filter:blur(18px);position:relative;z-index:1}
.form-card .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.form-card h2{font-family:'Fraunces',serif;font-size:32px;font-weight:600;margin:0 0 8px;color:var(--navy);letter-spacing:-.03em}
.form-card .sub{color:var(--muted);font-size:14px;margin:0 0 32px}

.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:7px;letter-spacing:.2px}
.field .input-wrap{position:relative}
.field input{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;
  background:#FBFAF7;transition:border-color .15s,box-shadow .15s,background .15s;
}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,161,91,.14);background:#fff}

.login-btn{
  width:100%;padding:14px;border:none;border-radius:11px;margin-top:6px;cursor:pointer;
  background:linear-gradient(135deg,var(--navy-2),var(--navy-light));color:#fff;font-weight:700;font-size:14.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s,box-shadow .15s,opacity .15s;
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(15,27,51,.28)}
.login-btn:disabled{opacity:.65;cursor:not-allowed;transform:none;box-shadow:none}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.login-btn.loading .spinner{display:inline-block}
.login-btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.login-error{
  background:#FDECEC;color:#B23C3C;border:1px solid #F5C6C6;border-radius:9px;padding:11px 13px;
  font-size:13px;margin-bottom:16px;display:none;align-items:flex-start;gap:8px;font-weight:500;
}
.login-error.show{display:flex}

.login-footer{margin-top:26px;text-align:center;font-size:12.5px;color:var(--muted)}
.login-footer a{color:var(--navy);font-weight:600}

/* Welcome cinematic sequence — abstract, premium, no illustrated character.
   Moonlit water with light glitter, slow elegant wave drift, kinetic wordmark reveal. */
.welcome-overlay{
  position:fixed;inset:0;z-index:999;overflow:hidden;background:#060A16;
  opacity:0;pointer-events:none;transition:opacity .6s ease;
}
.welcome-overlay.show{opacity:1;pointer-events:all}
.welcome-sky{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% -10%,#1a2c54 0%,#0d1830 42%,#060A16 100%)}

.welcome-moon{
  position:absolute;top:12%;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fdf6e3,#e9d6ac 60%,#c6a15b 100%);
  box-shadow:0 0 60px 18px rgba(233,214,172,.25),0 0 140px 50px rgba(198,161,91,.12);
  opacity:0;animation:moonRise 2.2s cubic-bezier(.2,.7,.2,1) forwards .1s;
}
@keyframes moonRise{0%{opacity:0;transform:translateX(-50%) translateY(14px) scale(.85)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

.welcome-glitter{
  position:absolute;top:12%;left:50%;width:2px;height:58%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(233,214,172,.5),rgba(233,214,172,.05) 80%);
  filter:blur(1px);opacity:0;animation:glitterFade 2s ease forwards .5s;
}
@keyframes glitterFade{to{opacity:1}}

.welcome-sea{position:absolute;left:0;right:0;bottom:0;height:46%;overflow:hidden}
.welcome-sea svg{position:absolute;bottom:0;width:220%;height:100%}
.wave-far{animation:introWaveScroll 14s linear infinite;opacity:.5}
.wave-mid{animation:introWaveScroll 10s linear infinite reverse;opacity:.72}
.wave-near{animation:introWaveScroll 7s linear infinite}
@keyframes introWaveScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.welcome-shimmer{
  position:absolute;bottom:0;left:50%;width:180px;height:46%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(233,214,172,.22),transparent 75%);
  clip-path:polygon(42% 0%,58% 0%,78% 100%,22% 100%);
  opacity:0;animation:shimmerFade 2.4s ease forwards .6s;
  mix-blend-mode:screen;
}
@keyframes shimmerFade{to{opacity:1}}
.welcome-shimmer::after{
  content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 62%);
  background-size:220% 100%;animation:shimmerSweep 3.4s ease-in-out infinite;animation-delay:1.4s;
}
@keyframes shimmerSweep{0%{background-position:120% 0}100%{background-position:-40% 0}}

.welcome-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.welcome-particle{position:absolute;bottom:6%;width:3px;height:3px;border-radius:50%;background:#E9D6AC;opacity:0;
  animation:particleFloat 5s ease-in infinite;box-shadow:0 0 6px 1px rgba(233,214,172,.7)}
@keyframes particleFloat{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  10%{opacity:.85}
  85%{opacity:.3}
  100%{opacity:0;transform:translateY(-220px) scale(1.1)}
}

.welcome-wordmark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:100%;
}
.welcome-word{
  font-family:'Fraunces',serif;font-weight:600;font-size:clamp(34px,6vw,58px);color:#fff;margin:0 0 14px;
  letter-spacing:.5em;text-shadow:0 0 50px rgba(198,161,91,.35);
}
.welcome-word span{display:inline-block;opacity:0;filter:blur(6px);animation:letterRise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes letterRise{to{opacity:1;filter:blur(0);transform:translateY(0)}from{transform:translateY(10px)}}
.welcome-rule{width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(233,214,172,.7),transparent);margin:0 auto 16px;
  animation:ruleGrow 1s ease forwards;animation-delay:1.5s}
@keyframes ruleGrow{to{width:180px}}
.welcome-name{font-family:'Fraunces',serif;font-weight:500;font-size:19px;color:rgba(255,255,255,.82);margin:0 0 6px;
  opacity:0;transform:translateY(6px);animation:softRise .8s ease forwards;animation-delay:1.75s}
.welcome-tag{font-size:12.5px;color:rgba(255,255,255,.4);margin:0;letter-spacing:.3px;
  opacity:0;transform:translateY(6px);animation:softRise .8s ease forwards;animation-delay:1.95s}
@keyframes softRise{to{opacity:1;transform:translateY(0)}}

.wave-anim{animation:waveMove 3.2s linear infinite}
.wave-anim2{animation:waveMove 4s linear infinite reverse}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.boat-anim{transform-origin:58px 84px;animation:boatRock 1.9s ease-in-out infinite}
@keyframes boatRock{0%,100%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(1.6deg) translateY(-1.5px)}}
.oar-stroke{transform-origin:58px 78px;animation:rowStroke 1.9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes rowStroke{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(8deg)}}
.rower-body{animation:rowLean 1.9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes rowLean{0%,100%{transform:translateY(-1px)}50%{transform:translateY(1.2px)}}
@media (max-width:700px){
  .welcome-name{font-size:24px}
  .welcome-boat-travel{bottom:24%;width:120px;height:96px}
  @keyframes welcomeBoatTravel{0%{opacity:0;transform:translateX(-55vw) scale(.7)}8%{opacity:1}100%{transform:translateX(calc(50vw - 100px)) scale(.95)}}
}

/* Setup-not-connected screen */
.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.setup-card{max-width:520px;background:#fff;border-radius:18px;padding:36px;box-shadow:var(--shadow);border:1px solid var(--border)}
.setup-card .icon{width:44px;height:44px;border-radius:12px;background:#FCF1DC;color:#8A5A00;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:18px}
.setup-card h2{font-family:'Fraunces',serif;margin:0 0 10px;font-size:22px;color:var(--navy)}
.setup-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}
.setup-card ol{margin:0 0 18px;padding-left:20px;color:var(--text);font-size:13.5px;line-height:1.9}
.setup-card code{background:#F3F1EA;padding:2px 6px;border-radius:5px;font-size:12.5px}

.ambient-wave{position:fixed;bottom:0;left:0;width:100%;height:110px;pointer-events:none;z-index:-1;opacity:.05;overflow:hidden}
.ambient-wave svg{width:200%;height:100%}
.ambient-wave .a1{animation:waveMove 22s linear infinite}
.ambient-wave .a2{animation:waveMove 30s linear infinite reverse}
/* ============================================================
   INTRO SPLASH — boat rows across the sea, then WAYFINDER reveals
   ============================================================ */
.intro-splash{
  position:fixed;inset:0;z-index:1000;overflow:hidden;background:#060B18;
  animation:introDismiss .6s ease forwards;animation-delay:4.6s;
}
.intro-splash.skip{animation:introDismiss .45s ease forwards !important;animation-delay:0s !important;}
@keyframes introDismiss{to{opacity:0;visibility:hidden;pointer-events:none}}

.skip-intro{
  position:absolute;top:22px;right:26px;z-index:20;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);font-size:12.5px;font-weight:600;
  padding:8px 14px;border-radius:999px;backdrop-filter:blur(4px);transition:background .15s,color .15s;
}
.skip-intro:hover{background:rgba(255,255,255,.16);color:#fff}

.intro-sky{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1c2e56 0%,#0e1830 45%,#060B18 100%)}
.intro-moon{
  position:absolute;top:12%;left:50%;transform:translateX(-50%);width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#F5E9CC,#C6A15B 70%);box-shadow:0 0 90px 30px rgba(198,161,91,.28);
  opacity:0;animation:moonFade 2.4s ease forwards;animation-delay:.3s;
}
@keyframes moonFade{to{opacity:.85}}

.intro-sea{position:absolute;left:0;right:0;bottom:0;height:46%;overflow:hidden}
.intro-sea svg{position:absolute;bottom:0;width:220%;height:100%}
.intro-wave-far{animation:introWaveScroll 9s linear infinite}
.intro-wave-mid{animation:introWaveScroll 6s linear infinite reverse}
.intro-wave-near{animation:introWaveScroll 4s linear infinite}
@keyframes introWaveScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.compass-stage{
  position:absolute;top:50%;left:50%;width:230px;height:230px;transform:translate(-50%,-58%) scale(.85);
  opacity:0;animation:compassIn .7s cubic-bezier(.2,.8,.3,1) forwards .2s;
}
@keyframes compassIn{to{opacity:1;transform:translate(-50%,-58%) scale(1)}}
.compass-svg{width:100%;height:100%;filter:drop-shadow(0 0 26px rgba(198,161,91,.25))}
.compass-ripple{transform-origin:100px 100px;opacity:0;stroke-width:1}
.compass-ripple.r1{animation:rippleOut 2.6s ease-out infinite}
.compass-ripple.r2{animation:rippleOut 2.6s ease-out infinite 1.3s}
@keyframes rippleOut{0%{opacity:0;transform:scale(.75)}12%{opacity:.5}100%{opacity:0;transform:scale(1.35)}}
.compass-needle{transform-origin:100px 100px;animation:needleFind 2.2s cubic-bezier(.22,.61,.36,1) forwards .5s}
@keyframes needleFind{
  0%{transform:rotate(0deg)}
  18%{transform:rotate(300deg)}
  36%{transform:rotate(560deg)}
  54%{transform:rotate(760deg)}
  70%{transform:rotate(895deg)}
  84%{transform:rotate(945deg)}
  100%{transform:rotate(930deg)}
}

.intro-wordmark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);text-align:center;opacity:0;
  animation:wordReveal 1.1s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:2.35s;
}
@keyframes wordReveal{0%{opacity:0;transform:translate(-50%,-40%) scale(.88)}100%{opacity:1;transform:translate(-50%,-46%) scale(1)}}
.intro-word{
  font-family:'Fraunces',serif;font-weight:600;font-size:52px;letter-spacing:6px;color:#fff;
  text-shadow:0 0 40px rgba(198,161,91,.5);
}
.intro-tag{font-size:14px;color:rgba(233,214,172,.75);letter-spacing:2px;margin-top:8px;text-transform:uppercase}

@media (max-width:700px){
  .intro-word{font-size:34px;letter-spacing:3px}
  .compass-stage{width:170px;height:170px}
    75%{transform:translateX(calc(50vw - 120px)) scale(1)}
    100%{transform:translateX(calc(50vw - 120px)) scale(1)}
  }
}

/* Tideborne Command visual system: warm brass direction, deep-water depth, motion only where it communicates progress. */

.brand .mark,.brandmark .box{box-shadow:0 0 0 1px rgba(240,220,169,.08),0 12px 30px rgba(0,0,0,.2);}
.brand .mark img,.brandmark .box img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(201,161,91,.28));}
.content{max-width:1380px;position:relative;}
.card,.stat-card{border-color:rgba(197,161,91,.18);box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:transform .24s var(--ease-out),box-shadow .24s var(--ease-out),border-color .24s var(--ease-out);}
.card:hover,.stat-card:hover{transform:translateY(-2px);box-shadow:0 24px 58px rgba(7,17,31,.13);border-color:rgba(197,161,91,.38);}
.page-head h1,.agent-header h1{letter-spacing:-.02em;}
.live-badge{box-shadow:0 0 0 5px rgba(62,158,114,.07);}
.progress-fill,.pipeline-fill,.mini-seg-fill{background:linear-gradient(90deg,#C9A15B 0%,#E4C47E 42%,#153A57 100%);box-shadow:0 0 15px rgba(201,161,91,.22);}
.task-row{background:rgba(255,255,255,.56);transition:transform .22s var(--ease-out),box-shadow .22s var(--ease-out),border-color .22s var(--ease-out);}
.task-row:hover{transform:translateX(3px);border-color:rgba(201,161,91,.5);box-shadow:0 12px 30px rgba(7,17,31,.08);}
.task-row.task-complete{background:linear-gradient(100deg,rgba(232,247,238,.9),rgba(255,255,255,.88));}
.task-complete .task-status-dot{box-shadow:0 0 0 6px rgba(62,158,114,.12);}
.help-link{position:relative;overflow:hidden;}
.help-link::after{content:"";position:absolute;inset:0;transform:translateX(-110%);background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transition:transform .5s var(--ease-out);}
.help-link:hover::after{transform:translateX(110%);}
.fleet-hero,.chart-card,.agent-card{position:relative;overflow:hidden;}
.fleet-hero::after,.chart-card::after,.agent-card::after{content:"";position:absolute;inset:auto -30% -70% 20%;height:120px;background:radial-gradient(ellipse,rgba(201,161,91,.12),transparent 65%);pointer-events:none;}
.agent-card{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(248,244,234,.82));}
.agent-card-ring,.fleet-ring,.ring{filter:drop-shadow(0 8px 18px rgba(201,161,91,.14));}
.reveal-up{transition-duration:.72s;}
@media (prefers-reduced-motion:no-preference){
  .sidebar::after{animation:seaDrift 18s ease-in-out infinite alternate;}
  .card::before,.stat-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.36) 48%,transparent 72%);transform:translateX(-120%);opacity:0;transition:opacity .2s;}
  .card:hover::before,.stat-card:hover::before{opacity:1;animation:sheen 1.1s var(--ease-out);}
}
@keyframes seaDrift{from{transform:translate3d(-4%,0,0) scale(1.04)}to{transform:translate3d(4%,-5px,0) scale(1.08)}}
@keyframes sheen{to{transform:translateX(120%)}}
@media (max-width:880px){.sidebar::after{display:none}.content{padding:24px 18px 54px}.stat-grid{grid-template-columns:repeat(2,1fr)}.chart-grid,.fleet-grid{grid-template-columns:1fr}}

          <h2>Welcome back</h2>
          <p class="sub">Sign in with the email and password Skalvya set up for you.</p>

          <div id="loginError" class="login-error"></div>

          <form id="loginForm">
            <div class="field">

            <div class="field">

            </div>

              <span class="spinner"></span><span class="btn-text">Sign In</span>

  auth.onAuthStateChanged((user) => { if (user) routeByRole(user.uid); });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("loginError");
    errorBox.classList.remove("show");
    btn.disabled = true; btn.classList.add("loading");
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      await routeByRole(cred.user.uid);
    } catch (err) {
      errorBox.textContent = friendlyError(err);
      errorBox.classList.add("show");
      btn.disabled = false; btn.classList.remove("loading");
    }
  });

  async function routeByRole(uid) {
    try {
      const snap = await db.collection("users").doc(uid).get();
      const data = snap.exists ? snap.data() : {};
      const role = ["skalvya", "agent", "tyson"].includes(data.role) ? data.role : "unknown";
      const dest = role === "agent" ? "agent.html" : "master.html";
      buildWordmark("WAYFINDER");
      spawnParticles();
      document.getElementById("welcomeText").textContent = "Welcome back, " + (data.name ? data.name.split(" ")[0] : "there");
      document.getElementById("welcomeOverlay").classList.add("show");
      setTimeout(() => { window.location.href = dest; }, 3000);
    } catch (err) {
      const errorBox = document.getElementById("loginError");
      errorBox.textContent = "Something went wrong loading your account. Try again.";
      errorBox.classList.add("show");
    }
  }

  function buildWordmark(text) {
    const el = document.getElementById("welcomeWord");
    el.innerHTML = text.split("").map((ch, i) =>
      `<span style="animation-delay:${0.55 + i * 0.055}s">${ch}</span>`
    ).join("");
  }

  function spawnParticles() {
    const wrap = document.getElementById("welcomeParticles");
    wrap.innerHTML = "";
    for (let i = 0; i < 16; i++) {
      const p = document.createElement("div");
      p.className = "welcome-particle";
      p.style.left = (10 + Math.random() * 80) + "%";
      p.style.animationDelay = (Math.random() * 4) + "s";
      p.style.animationDuration = (4 + Math.random() * 2.5) + "s";
      wrap.appendChild(p);
    }
  }

  function friendlyError(err) {
    const code = err.code || "";
    if (code.includes("wrong-password") || code.includes("invalid-credential") || code.includes("user-not-found")) {
      return "That email or password isn't right — double check with Skalvya.";
    }
    if (code.includes("too-many-requests")) return "Too many attempts — wait a minute and try again.";
    if (code.includes("invalid-email")) return "That doesn't look like a valid email address.";
    return "Couldn't sign in. Please try again.";
  }
}
