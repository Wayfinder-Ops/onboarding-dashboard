<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Wayfinder Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="mark">WF</div>
        <div>
          <div class="name">WAYFINDER</div>
          <div class="sub">Onboarding Ops · Skalvya</div>
        </div>
      </div>
      <h1>Sign in</h1>
      <p class="tag">Use the email and password Skalvya set up for you.</p>

      <div id="loginError" class="login-error"></div>

      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" id="loginBtn" class="login-btn">Sign In</button>
      </form>

      <div class="login-footer">Trouble logging in? Message Skalvya on Slack.</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
