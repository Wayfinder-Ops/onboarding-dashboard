<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Wayfinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1120; --navy-2:#101C34; --navy-light:#1D305A;
  --navy-deep:#060A14;
  --gold:#CBA05C; --gold-light:#EAD9AE; --gold-deep:#8E6B34; --gold-glow:rgba(203,160,92,.35);
  --bg:#FAF7F1; --card:#FFFFFF; --text:#221B10; --muted:#8A7C63; --border:#EDE5D3;
  --green:#3E9E72; --yellow:#C08A2E; --red:#C24F4F;
  --shadow:0 1px 2px rgba(10,17,32,.06),0 22px 46px rgba(10,17,32,.11);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',serif}

.wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
@media (max-width:880px){.wrap{grid-template-columns:1fr}.panel-left{display:none}}

.panel-left{
  position:relative;overflow:hidden;
  background:radial-gradient(120% 120% at 15% 10%, #1a2c52 0%, #0e1930 55%, #070d1c 100%);
  padding:56px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
}
.panel-left::before{
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 80% 20%, rgba(198,161,91,.18), transparent 45%),
                    radial-gradient(circle at 20% 85%, rgba(198,161,91,.12), transparent 50%);
}
.panel-left .top{position:relative;z-index:1}
.brandmark{display:flex;align-items:center;gap:12px;margin-bottom:64px}
.brandmark .box{
  width:42px;height:42px;border-radius:11px;border:1.5px solid rgba(233,214,172,.4);
  display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-weight:700;font-size:14px;letter-spacing:.5px;
  background:rgba(255,255,255,.04);animation:markSway 4.2s ease-in-out infinite;transform-origin:50% 65%;
}
@keyframes markSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.brandmark .word{font-weight:800;font-size:15px;letter-spacing:2px;color:#fff}
.panel-left h1{
  font-family:'Fraunces',serif;font-weight:600;font-size:40px;line-height:1.18;margin:0 0 20px;
  max-width:420px;color:#fff;position:relative;z-index:1;
}
.panel-left h1 em{color:var(--gold-light);font-style:italic}
.panel-left p{color:rgba(255,255,255,.6);font-size:15px;line-height:1.6;max-width:380px;position:relative;z-index:1}
.panel-left .bottom{position:relative;z-index:1;display:flex;gap:28px;flex-wrap:wrap}
.stat{}
.stat .n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold-light)}
.stat .l{font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.3px;margin-top:2px}

.panel-right{display:flex;align-items:center;justify-content:center;padding:32px}
.form-card{width:100%;max-width:380px}
.form-card .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.form-card h2{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin:0 0 8px;color:var(--navy)}
.form-card .sub{color:var(--muted);font-size:14px;margin:0 0 32px}

.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:7px;letter-spacing:.2px}
.field .input-wrap{position:relative}
.field input{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;
  background:#FBFAF7;transition:border-color .15s,box-shadow .15s,background .15s;
}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,161,91,.14);background:#fff}

.login-btn{
  width:100%;padding:14px;border:none;border-radius:11px;margin-top:6px;cursor:pointer;
  background:linear-gradient(135deg,var(--navy-2),var(--navy-light));color:#fff;font-weight:700;font-size:14.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s,box-shadow .15s,opacity .15s;
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(15,27,51,.28)}
.login-btn:disabled{opacity:.65;cursor:not-allowed;transform:none;box-shadow:none}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.login-btn.loading .spinner{display:inline-block}
.login-btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.login-error{
  background:#FDECEC;color:#B23C3C;border:1px solid #F5C6C6;border-radius:9px;padding:11px 13px;
  font-size:13px;margin-bottom:16px;display:none;align-items:flex-start;gap:8px;font-weight:500;
}
.login-error.show{display:flex}

.login-footer{margin-top:26px;text-align:center;font-size:12.5px;color:var(--muted)}
.login-footer a{color:var(--navy);font-weight:600}

/* Welcome cinematic sequence — post-login, personalized. Mirrors the intro splash's
   proven wave/boat technique for visual consistency and reliability. */
.welcome-overlay{
  position:fixed;inset:0;z-index:999;overflow:hidden;background:#060B18;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.welcome-overlay.show{opacity:1;pointer-events:all}
.welcome-sky{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1c2e56 0%,#0e1830 45%,#060B18 100%)}
.welcome-glow{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(198,161,91,.22) 0%,transparent 70%);opacity:0;animation:moonFade 1.6s ease forwards .1s}
@keyframes moonFade{to{opacity:1}}

.welcome-sea{position:absolute;left:0;right:0;bottom:0;height:44%;overflow:hidden}
.welcome-sea svg{position:absolute;bottom:0;width:220%;height:100%}
.wave-far{animation:introWaveScroll 9s linear infinite}
.wave-mid{animation:introWaveScroll 6s linear infinite reverse}
.wave-near{animation:introWaveScroll 4s linear infinite}
@keyframes introWaveScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.welcome-boat-travel{
  position:absolute;bottom:20%;left:0;width:150px;height:120px;
  animation:welcomeBoatTravel 2.5s cubic-bezier(.4,.05,.3,1) forwards .3s;opacity:0;
}
@keyframes welcomeBoatTravel{
  0%{opacity:0;transform:translateX(-35vw) scale(.82)}
  8%{opacity:1}
  100%{transform:translateX(calc(50vw - 130px)) scale(1.08)}
}

.welcome-wordmark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);text-align:center;opacity:0;
  animation:wordReveal 1s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:2.05s;
}
.welcome-flash{
  position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(233,214,172,.6) 40%,transparent 75%);
  transform:translate(-50%,-50%) scale(1);opacity:0;
  animation:flashBurst .9s ease-out forwards;animation-delay:1.95s;
}
@keyframes flashBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(1)}15%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(70)}}
@keyframes wordReveal{0%{opacity:0;transform:translate(-50%,-40%) scale(.9)}100%{opacity:1;transform:translate(-50%,-46%) scale(1)}}
.welcome-word{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:6px;color:rgba(233,214,172,.8);text-transform:uppercase;margin:0 0 10px}
.welcome-name{font-family:'Fraunces',serif;font-weight:600;font-size:34px;color:#fff;margin:0 0 8px;text-shadow:0 0 40px rgba(198,161,91,.4)}
.welcome-tag{font-size:13.5px;color:rgba(255,255,255,.5);margin:0}

.wave-anim{animation:waveMove 3.2s linear infinite}
.wave-anim2{animation:waveMove 4s linear infinite reverse}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.boat-anim{transform-origin:58px 84px;animation:boatRock 1.3s ease-in-out infinite}
@keyframes boatRock{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
.oar-stroke{transform-origin:58px 78px;animation:rowStroke 0.85s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes rowStroke{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(14deg)}}
.rower-body{animation:rowLean 0.85s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes rowLean{0%,100%{transform:translateY(-1.5px)}50%{transform:translateY(2px)}}
@media (max-width:700px){
  .welcome-name{font-size:24px}
  .welcome-boat-travel{bottom:24%;width:120px;height:96px}
  @keyframes welcomeBoatTravel{0%{opacity:0;transform:translateX(-55vw) scale(.7)}8%{opacity:1}100%{transform:translateX(calc(50vw - 100px)) scale(.95)}}
}

/* Setup-not-connected screen */
.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.setup-card{max-width:520px;background:#fff;border-radius:18px;padding:36px;box-shadow:var(--shadow);border:1px solid var(--border)}
.setup-card .icon{width:44px;height:44px;border-radius:12px;background:#FCF1DC;color:#8A5A00;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:18px}
.setup-card h2{font-family:'Fraunces',serif;margin:0 0 10px;font-size:22px;color:var(--navy)}
.setup-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}
.setup-card ol{margin:0 0 18px;padding-left:20px;color:var(--text);font-size:13.5px;line-height:1.9}
.setup-card code{background:#F3F1EA;padding:2px 6px;border-radius:5px;font-size:12.5px}

.ambient-wave{position:fixed;bottom:0;left:0;width:100%;height:110px;pointer-events:none;z-index:-1;opacity:.05;overflow:hidden}
.ambient-wave svg{width:200%;height:100%}
.ambient-wave .a1{animation:waveMove 22s linear infinite}
.ambient-wave .a2{animation:waveMove 30s linear infinite reverse}
/* ============================================================
   INTRO SPLASH — boat rows across the sea, then WAYFINDER reveals
   ============================================================ */
.intro-splash{
  position:fixed;inset:0;z-index:1000;overflow:hidden;background:#060B18;
  animation:introDismiss .6s ease forwards;animation-delay:4.6s;
}
.intro-splash.skip{animation:introDismiss .45s ease forwards !important;animation-delay:0s !important;}
@keyframes introDismiss{to{opacity:0;visibility:hidden;pointer-events:none}}

.skip-intro{
  position:absolute;top:22px;right:26px;z-index:20;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);font-size:12.5px;font-weight:600;
  padding:8px 14px;border-radius:999px;backdrop-filter:blur(4px);transition:background .15s,color .15s;
}
.skip-intro:hover{background:rgba(255,255,255,.16);color:#fff}

.intro-sky{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1c2e56 0%,#0e1830 45%,#060B18 100%)}
.intro-moon{
  position:absolute;top:12%;left:50%;transform:translateX(-50%);width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#F5E9CC,#C6A15B 70%);box-shadow:0 0 90px 30px rgba(198,161,91,.28);
  opacity:0;animation:moonFade 2.4s ease forwards;animation-delay:.3s;
}
@keyframes moonFade{to{opacity:.85}}

.intro-sea{position:absolute;left:0;right:0;bottom:0;height:46%;overflow:hidden}
.intro-sea svg{position:absolute;bottom:0;width:220%;height:100%}
.intro-wave-far{animation:introWaveScroll 9s linear infinite}
.intro-wave-mid{animation:introWaveScroll 6s linear infinite reverse}
.intro-wave-near{animation:introWaveScroll 4s linear infinite}
@keyframes introWaveScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.intro-boat-travel{
  position:absolute;bottom:20%;left:0;width:170px;height:130px;
  animation:boatTravel 4s cubic-bezier(.4,.05,.3,1) forwards;animation-delay:.4s;
  opacity:0;
}
@keyframes boatTravel{
  0%{opacity:0;transform:translateX(-40vw) scale(.8)}
  8%{opacity:1}
  75%{transform:translateX(calc(50vw - 155px)) scale(1.15)}
  100%{transform:translateX(calc(50vw - 155px)) scale(1.15)}
}
.intro-boat-svg{width:100%;height:100%}
.intro-boat-bob{transform-origin:80px 100px;animation:boatRock 2.6s ease-in-out infinite}
.intro-rower{animation:rowLean 1.4s cubic-bezier(.45,.05,.55,.95) infinite}
.intro-oars{transform-origin:79px 80px;animation:rowStroke 1.4s cubic-bezier(.45,.05,.55,.95) infinite}

.intro-wordmark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);text-align:center;opacity:0;
  animation:wordReveal 1.1s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:3.15s;
}
@keyframes wordReveal{0%{opacity:0;transform:translate(-50%,-40%) scale(.88)}100%{opacity:1;transform:translate(-50%,-46%) scale(1)}}
.intro-word{
  font-family:'Fraunces',serif;font-weight:600;font-size:52px;letter-spacing:6px;color:#fff;
  text-shadow:0 0 40px rgba(198,161,91,.5);
}
.intro-tag{font-size:14px;color:rgba(233,214,172,.75);letter-spacing:2px;margin-top:8px;text-transform:uppercase}

@media (max-width:700px){
  .intro-word{font-size:34px;letter-spacing:3px}
  .intro-boat-travel{bottom:24%;width:130px;height:100px}
  @keyframes boatTravel{
    0%{opacity:0;transform:translateX(-60vw) scale(.7)}
    8%{opacity:1}
    75%{transform:translateX(calc(50vw - 120px)) scale(1)}
    100%{transform:translateX(calc(50vw - 120px)) scale(1)}
  }
}
</style>
</head>
<body>
<div class="ambient-wave">
  <svg viewBox="0 0 240 40" preserveAspectRatio="none">
    <path class="a1" d="M0 28 Q10 22 20 28 T40 28 T60 28 T80 28 T100 28 T120 28 T140 28 T160 28 T180 28 T200 28 T220 28 T240 28" fill="none" stroke="#CBA05C" stroke-width="1"/>
    <path class="a2" d="M0 34 Q10 30 20 34 T40 34 T60 34 T80 34 T100 34 T120 34 T140 34 T160 34 T180 34 T200 34 T220 34 T240 34" fill="none" stroke="#0A1120" stroke-width="1"/>
  </svg>
</div>

    <svg class="intro-wave-near" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 38 Q25 26 50 38 T100 38 T150 38 T200 38 T250 38 T300 38 T350 38 T400 38 T450 38 T500 38 T550 38 T600 38 T650 38 T700 38 T750 38 T800 38 V60 H0 Z" fill="#0B1428"/></svg>

      <ellipse cx="80" cy="98" rx="34" ry="4" fill="#000" opacity=".18"/>
      <g class="intro-boat-bob">
        <path d="M44 92 L116 92 L102 108 L58 108 Z" fill="#E9D6AC"/>
        <path d="M44 92 L116 92 L113 96 L47 96 Z" fill="#C6A15B"/>
        <g class="intro-rower">
          <path d="M80 88 Q73 76 77 62" stroke="#0A1120" stroke-width="4.5" fill="none" stroke-linecap="round"/>

            <line x1="79" y1="80" x2="34" y2="60" stroke="#C6A15B" stroke-width="3.4" stroke-linecap="round"/>

          </g>
        </g>
      </g>
    </svg>
  </div>

  <div class="intro-wordmark">
    <div class="intro-word">WAYFINDER</div>
    <div class="intro-tag">Onboarding, charted.</div>
  </div>
</div>

<div id="app">
  <div class="setup-screen"><div class="setup-card">
    <div class="icon">&#9881;</div>
    <h2>Loading...</h2>
  </div></div>
</div>

<div id="welcomeOverlay" class="welcome-overlay">
  <div class="welcome-sky"></div>
  <div class="welcome-glow"></div>
  <div class="welcome-sea">
    <svg class="wave-far" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30 Q25 15 50 30 T100 30 T150 30 T200 30 T250 30 T300 30 T350 30 T400 30 T450 30 T500 30 T550 30 T600 30 T650 30 T700 30 T750 30 T800 30 V60 H0 Z" fill="#16274A" opacity=".55"/></svg>
    <svg class="wave-mid" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 34 Q25 20 50 34 T100 34 T150 34 T200 34 T250 34 T300 34 T350 34 T400 34 T450 34 T500 34 T550 34 T600 34 T650 34 T700 34 T750 34 T800 34 V60 H0 Z" fill="#1B2C52" opacity=".75"/></svg>
    <svg class="wave-near" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 38 Q25 26 50 38 T100 38 T150 38 T200 38 T250 38 T300 38 T350 38 T400 38 T450 38 T500 38 T550 38 T600 38 T650 38 T700 38 T750 38 T800 38 V60 H0 Z" fill="#0B1428"/></svg>
  </div>
  <div class="welcome-boat-travel">
    <svg viewBox="0 0 160 120" width="100%" height="100%">
      <ellipse cx="80" cy="98" rx="34" ry="4" fill="#000" opacity=".18"/>
      <g class="boat-anim">
        <path d="M44 92 L116 92 L102 108 L58 108 Z" fill="#E9D6AC"/>
        <path d="M44 92 L116 92 L113 96 L47 96 Z" fill="#C6A15B"/>
        <g class="rower-body">
          <path d="M80 88 Q73 76 77 62" stroke="#0A1120" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <circle cx="78" cy="55" r="7" fill="#0A1120"/>
          <g class="oar-stroke">
            <line x1="79" y1="80" x2="34" y2="60" stroke="#C6A15B" stroke-width="3.4" stroke-linecap="round"/>
            <line x1="79" y1="80" x2="124" y2="60" stroke="#C6A15B" stroke-width="3.4" stroke-linecap="round"/>
            <ellipse cx="29" cy="58" rx="5.5" ry="2.6" fill="#E9D6AC" transform="rotate(-22 29 58)"/>
            <ellipse cx="129" cy="58" rx="5.5" ry="2.6" fill="#E9D6AC" transform="rotate(22 129 58)"/>
          </g>
        </g>
      </g>
    </svg>
  </div>
  <div class="welcome-flash"></div>
  <div class="welcome-wordmark">
    <div class="welcome-word">Wayfinder</div>
    <div class="welcome-name" id="welcomeText">Welcome back</div>
    <div class="welcome-tag">Charting your course into onboarding...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const introEl = document.getElementById("introSplash");
const skipBtn = document.getElementById("skipIntro");
if (skipBtn) skipBtn.addEventListener("click", () => introEl.classList.add("skip"));
setTimeout(() => { if (introEl) introEl.style.display = "none"; }, 5300);

/* ============================================================
   FIREBASE CONFIG — replace the REPLACE_ME values below.
   This exact block also appears at the top of agent.html and
   master.html — update it in all three files the same way.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDRWQYxeV2Hkize1Py7O4D-h2Av14sqMj4",
  authDomain: "wayfinder-onboarding.firebaseapp.com",
  projectId: "wayfinder-onboarding",
  storageBucket: "wayfinder-onboarding.firebasestorage.app",
  messagingSenderId: "105454511155",
  appId: "1:105454511155:web:1cdc4b1294c7557fb46f46",
};
const CONFIGURED = firebaseConfig.apiKey !== "REPLACE_ME" && firebaseConfig.apiKey.length > 10;

// Global safety net: surface any unexpected JS error visibly instead of failing silently.
window.addEventListener("error", (e) => showFatalError(e.error || e.message));
window.addEventListener("unhandledrejection", (e) => showFatalError(e.reason));
function showFatalError(err) {
  console.error(err);
  let bar = document.getElementById("__fatalErrorBar");
  if (bar) return; // only show the first one, avoid spam
  bar = document.createElement("div");
  bar.id = "__fatalErrorBar";
  bar.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#B23C3C;color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;z-index:9999;font-family:sans-serif;display:flex;justify-content:space-between;align-items:center;gap:12px;";
  const msg = (err && err.message) ? err.message : String(err);
  bar.innerHTML = "<span>Something broke on this page: " + msg.replace(/</g,"&lt;") + "</span>";
  const btn = document.createElement("button");
  btn.textContent = "Dismiss";
  btn.style.cssText = "background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:700;flex-shrink:0;";
  btn.onclick = () => bar.remove();
  bar.appendChild(btn);
  document.body.appendChild(bar);
}

const app = document.getElementById("app");

if (!CONFIGURED) {
  app.innerHTML = `
    <div class="setup-screen"><div class="setup-card">
      <div class="icon">&#9881;</div>
      <h2>Dashboard not connected yet</h2>
      <p>This page is working correctly — it just needs your Firebase project's keys before it can sign anyone in.</p>
      <ol>
        <li>Open <code>login.html</code> (this file) in your code editor</li>
        <li>Find the block that starts with <code>const firebaseConfig = {</code></li>
        <li>Replace all six <code>REPLACE_ME</code> values with your real Firebase config (see README.md, Step 4)</li>
        <li>Do the same in <code>agent.html</code> and <code>master.html</code></li>
        <li>Save and re-upload to GitHub</li>
      </ol>
      <p style="margin-bottom:0;">Once that's done, this screen is replaced automatically by the real sign-in page.</p>
    </div></div>`;
} else {
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  app.innerHTML = `
    <div class="wrap">
      <div class="panel-left">
        <div class="top">
          <div class="brandmark">
            <div class="box"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="11" fill="none" stroke="#CBA05C" stroke-width=".8" opacity=".7"/><path d="M8 15.5 L16 15.5 L14.5 18 L9.5 18 Z" fill="#EAD9AE"/><line x1="11.6" y1="15.5" x2="11.6" y2="6.5" stroke="#EAD9AE" stroke-width=".9"/><path d="M11.6 6.5 L11.6 15 L15.6 13 Z" fill="#CBA05C"/></svg></div>
            <div class="word">WAYFINDER</div>
          </div>
          <h1>The operating system<br/>behind every agent's<br/><em>first 90 days.</em></h1>
          <p>One place to track every step of onboarding — application, licensing, branding, and go-live — built by Skalvya for the Wayfinder team.</p>
        </div>
        <div class="bottom">
          <div class="stat"><div class="n">4</div><div class="l">ONBOARDING PHASES</div></div>
          <div class="stat"><div class="n">23</div><div class="l">TRACKED TASKS</div></div>
          <div class="stat"><div class="n">Live</div><div class="l">REAL-TIME SYNC</div></div>
        </div>
      </div>

      <div class="panel-right">
        <div class="form-card">
          <div class="eyebrow">Skalvya × Wayfinder</div>
          <h2>Welcome back</h2>
          <p class="sub">Sign in with the email and password Skalvya set up for you.</p>

          <div id="loginError" class="login-error"></div>

          <form id="loginForm">
            <div class="field">
              <label>Email</label>
              <input type="email" id="email" required autocomplete="username" placeholder="you@example.com" />
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
            </div>
            <button type="submit" id="loginBtn" class="login-btn">
              <span class="spinner"></span><span class="btn-text">Sign In</span>
            </button>
          </form>
          <div class="login-footer">Trouble signing in? Message Skalvya on Slack.</div>
        </div>
      </div>
    </div>`;

  auth.onAuthStateChanged((user) => { if (user) routeByRole(user.uid); });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("loginError");
    errorBox.classList.remove("show");
    btn.disabled = true; btn.classList.add("loading");
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      await routeByRole(cred.user.uid);
    } catch (err) {
      errorBox.textContent = friendlyError(err);
      errorBox.classList.add("show");
      btn.disabled = false; btn.classList.remove("loading");
    }
  });

  async function routeByRole(uid) {
    try {
      const snap = await db.collection("users").doc(uid).get();
      const data = snap.exists ? snap.data() : {};
      const role = ["skalvya", "agent", "tyson"].includes(data.role) ? data.role : "unknown";
      const dest = role === "agent" ? "agent.html" : "master.html";
      document.getElementById("welcomeText").textContent = "Welcome back, " + (data.name ? data.name.split(" ")[0] : "there");
      document.getElementById("welcomeOverlay").classList.add("show");
      setTimeout(() => { window.location.href = dest; }, 3100);
    } catch (err) {
      const errorBox = document.getElementById("loginError");
      errorBox.textContent = "Something went wrong loading your account. Try again.";
      errorBox.classList.add("show");
    }
  }

  function friendlyError(err) {
    const code = err.code || "";
    if (code.includes("wrong-password") || code.includes("invalid-credential") || code.includes("user-not-found")) {
      return "That email or password isn't right — double check with Skalvya.";
    }
    if (code.includes("too-many-requests")) return "Too many attempts — wait a minute and try again.";
    if (code.includes("invalid-email")) return "That doesn't look like a valid email address.";
    return "Couldn't sign in. Please try again.";
  }
}
</script>
</body>
</html>
