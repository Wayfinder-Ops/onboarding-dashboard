<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Wayfinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1120; --navy-2:#101C34; --navy-light:#1D305A;
  --navy-deep:#060A14;
  --gold:#CBA05C; --gold-light:#EAD9AE; --gold-deep:#8E6B34; --gold-glow:rgba(203,160,92,.35);
  --bg:#FAF7F1; --card:#FFFFFF; --text:#221B10; --muted:#8A7C63; --border:#EDE5D3;
  --green:#3E9E72; --yellow:#C08A2E; --red:#C24F4F;
  --shadow:0 1px 2px rgba(10,17,32,.06),0 22px 46px rgba(10,17,32,.11);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',serif}

.wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
@media (max-width:880px){.wrap{grid-template-columns:1fr}.panel-left{display:none}}

.panel-left{
  position:relative;overflow:hidden;
  background:radial-gradient(120% 120% at 15% 10%, #1a2c52 0%, #0e1930 55%, #070d1c 100%);
  padding:56px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
}
.panel-left::before{
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 80% 20%, rgba(198,161,91,.18), transparent 45%),
                    radial-gradient(circle at 20% 85%, rgba(198,161,91,.12), transparent 50%);
}
.panel-left .top{position:relative;z-index:1}
.brandmark{display:flex;align-items:center;gap:12px;margin-bottom:64px}
.brandmark .box{
  width:42px;height:42px;border-radius:11px;border:1.5px solid rgba(233,214,172,.4);
  display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-weight:700;font-size:14px;letter-spacing:.5px;
  background:rgba(255,255,255,.04);
}
.brandmark .word{font-weight:800;font-size:15px;letter-spacing:2px;color:#fff}
.panel-left h1{
  font-family:'Fraunces',serif;font-weight:600;font-size:40px;line-height:1.18;margin:0 0 20px;
  max-width:420px;color:#fff;position:relative;z-index:1;
}
.panel-left h1 em{color:var(--gold-light);font-style:italic}
.panel-left p{color:rgba(255,255,255,.6);font-size:15px;line-height:1.6;max-width:380px;position:relative;z-index:1}
.panel-left .bottom{position:relative;z-index:1;display:flex;gap:28px;flex-wrap:wrap}
.stat{}
.stat .n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold-light)}
.stat .l{font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.3px;margin-top:2px}

.panel-right{display:flex;align-items:center;justify-content:center;padding:32px}
.form-card{width:100%;max-width:380px}
.form-card .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.form-card h2{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin:0 0 8px;color:var(--navy)}
.form-card .sub{color:var(--muted);font-size:14px;margin:0 0 32px}

.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:7px;letter-spacing:.2px}
.field .input-wrap{position:relative}
.field input{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;
  background:#FBFAF7;transition:border-color .15s,box-shadow .15s,background .15s;
}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,161,91,.14);background:#fff}

.login-btn{
  width:100%;padding:14px;border:none;border-radius:11px;margin-top:6px;cursor:pointer;
  background:linear-gradient(135deg,var(--navy-2),var(--navy-light));color:#fff;font-weight:700;font-size:14.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s,box-shadow .15s,opacity .15s;
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(15,27,51,.28)}
.login-btn:disabled{opacity:.65;cursor:not-allowed;transform:none;box-shadow:none}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.login-btn.loading .spinner{display:inline-block}
.login-btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.login-error{
  background:#FDECEC;color:#B23C3C;border:1px solid #F5C6C6;border-radius:9px;padding:11px 13px;
  font-size:13px;margin-bottom:16px;display:none;align-items:flex-start;gap:8px;font-weight:500;
}
.login-error.show{display:flex}

.login-footer{margin-top:26px;text-align:center;font-size:12.5px;color:var(--muted)}
.login-footer a{color:var(--navy);font-weight:600}

/* Welcome transition */
.welcome-overlay{
  position:fixed;inset:0;background:radial-gradient(120% 120% at 50% 40%,#101C34 0%,#0a1428 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;
  opacity:0;pointer-events:none;transition:opacity .4s ease;
}
.welcome-overlay.show{opacity:1;pointer-events:all}
.welcome-overlay .boat-wrap{width:110px;height:110px;margin-bottom:22px;opacity:0;transform:scale(.85);transition:opacity .5s ease .1s,transform .5s cubic-bezier(.2,.8,.3,1) .1s}
.welcome-overlay.show .boat-wrap{opacity:1;transform:scale(1)}
.welcome-overlay h2{font-family:'Fraunces',serif;color:#fff;font-size:24px;font-weight:600;margin:0 0 6px;opacity:0;transform:translateY(8px);transition:opacity .5s ease .25s,transform .5s ease .25s}
.welcome-overlay.show h2{opacity:1;transform:none}
.welcome-overlay p{color:rgba(255,255,255,.5);font-size:13.5px;margin:0;opacity:0;transition:opacity .5s ease .35s}
.welcome-overlay.show p{opacity:1}
.wave-anim{animation:waveMove 3.2s linear infinite}
.wave-anim2{animation:waveMove 4s linear infinite reverse}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.boat-anim{transform-origin:58px 80px;animation:boatRock 2.6s ease-in-out infinite}
@keyframes boatRock{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-2px)}}
.sparkle-star{transform-origin:85px 35px;animation:sparkleTwinkle 2.4s ease-in-out infinite}
.sparkle-dot{transform-origin:40px 48px;animation:sparkleTwinkle 2.8s ease-in-out infinite .3s}
.sparkle-dot2{transform-origin:74px 52px;animation:sparkleTwinkle 3.1s ease-in-out infinite .65s}
@keyframes sparkleTwinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* Setup-not-connected screen */
.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.setup-card{max-width:520px;background:#fff;border-radius:18px;padding:36px;box-shadow:var(--shadow);border:1px solid var(--border)}
.setup-card .icon{width:44px;height:44px;border-radius:12px;background:#FCF1DC;color:#8A5A00;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:18px}
.setup-card h2{font-family:'Fraunces',serif;margin:0 0 10px;font-size:22px;color:var(--navy)}
.setup-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}
.setup-card ol{margin:0 0 18px;padding-left:20px;color:var(--text);font-size:13.5px;line-height:1.9}
.setup-card code{background:#F3F1EA;padding:2px 6px;border-radius:5px;font-size:12.5px}

.ambient-wave{position:fixed;bottom:0;left:0;width:100%;height:110px;pointer-events:none;z-index:-1;opacity:.05;overflow:hidden}
.ambient-wave svg{width:200%;height:100%}
.ambient-wave .a1{animation:waveMove 22s linear infinite}
.ambient-wave .a2{animation:waveMove 30s linear infinite reverse}
</style>
</head>
<body>
<div class="ambient-wave">
  <svg viewBox="0 0 240 40" preserveAspectRatio="none">
    <path class="a1" d="M0 28 Q10 22 20 28 T40 28 T60 28 T80 28 T100 28 T120 28 T140 28 T160 28 T180 28 T200 28 T220 28 T240 28" fill="none" stroke="#CBA05C" stroke-width="1"/>
    <path class="a2" d="M0 34 Q10 30 20 34 T40 34 T60 34 T80 34 T100 34 T120 34 T140 34 T160 34 T180 34 T200 34 T220 34 T240 34" fill="none" stroke="#0A1120" stroke-width="1"/>
  </svg>
</div>


<div id="app">
  <div class="setup-screen"><div class="setup-card">
    <div class="icon">&#9881;</div>
    <h2>Loading...</h2>
  </div></div>
</div>

<div id="welcomeOverlay" class="welcome-overlay">
  <div class="boat-wrap">
<svg viewBox="0 0 120 120" width="100%" height="100%">
      <circle cx="60" cy="60" r="58" fill="none" stroke="#CBA05C" stroke-width="1" opacity=".55"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#CBA05C" stroke-width=".6" opacity=".3"/>
      <g stroke="#CBA05C" stroke-width="1" opacity=".5">
        <line x1="110" y1="60" x2="118" y2="60"/><line x1="103.3" y1="85" x2="110.3" y2="89"/>
        <line x1="85" y1="103.3" x2="89" y2="110.3"/><line x1="60" y1="110" x2="60" y2="118"/>
        <line x1="35" y1="103.3" x2="31" y2="110.3"/><line x1="16.7" y1="85" x2="9.7" y2="89"/>
        <line x1="10" y1="60" x2="2" y2="60"/><line x1="16.7" y1="35" x2="9.7" y2="31"/>
        <line x1="35" y1="16.7" x2="31" y2="9.7"/><line x1="60" y1="10" x2="60" y2="2"/>
        <line x1="85" y1="16.7" x2="89" y2="9.7"/><line x1="103.3" y1="35" x2="110.3" y2="31"/>
      </g>
      <path class="sparkle-star" d="M85 26 L87.5 33 L94 35 L87.5 37 L85 44 L82.5 37 L76 35 L82.5 33 Z" fill="#EAD9AE"/>
      <path class="sparkle-dot" d="M40 44 L41 47 L44 48 L41 49 L40 52 L39 49 L36 48 L39 47 Z" fill="#EAD9AE" opacity=".55"/>
      <path class="sparkle-dot2" d="M74 50 L74.7 52 L77 52.7 L74.7 53.4 L74 55.5 L73.3 53.4 L71 52.7 L73.3 52 Z" fill="#EAD9AE" opacity=".4"/>
      <g class="wave-anim" fill="none" stroke="#CBA05C" stroke-width="1.6" opacity=".5">
        <path d="M-20 90 Q-10 85 0 90 T20 90 T40 90 T60 90 T80 90 T100 90 T120 90 T140 90"/></g>
      <g class="wave-anim2" fill="none" stroke="#EAD9AE" stroke-width="1.2" opacity=".3">
        <path d="M-20 96 Q-10 92 0 96 T20 96 T40 96 T60 96 T80 96 T100 96 T120 96 T140 96"/></g>
      <g class="boat-anim">
        <path d="M40 78 L80 78 L73 90 L47 90 Z" fill="#EAD9AE"/>
        <line x1="58" y1="78" x2="58" y2="34" stroke="#EAD9AE" stroke-width="1.8"/>
        <path d="M58 34 L58 76 L78 68 Z" fill="#CBA05C" opacity=".92"/>
        <ellipse cx="58" cy="70" rx="3.4" ry="6.5" fill="#0A1120"/>
        <circle cx="58" cy="61.5" r="3" fill="#0A1120"/>
      </g>
    </svg>
  </div>
  <h2 id="welcomeText">Welcome back</h2>
  <p>Charting your course into Wayfinder...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   FIREBASE CONFIG — replace the REPLACE_ME values below.
   This exact block also appears at the top of agent.html and
   master.html — update it in all three files the same way.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDRWQYxeV2Hkize1Py7O4D-h2Av14sqMj4",
  authDomain: "wayfinder-onboarding.firebaseapp.com",
  projectId: "wayfinder-onboarding",
  storageBucket: "wayfinder-onboarding.firebasestorage.app",
  messagingSenderId: "105454511155",
  appId: "1:105454511155:web:1cdc4b1294c7557fb46f46",
};
const CONFIGURED = firebaseConfig.apiKey !== "REPLACE_ME" && firebaseConfig.apiKey.length > 10;

// Global safety net: surface any unexpected JS error visibly instead of failing silently.
window.addEventListener("error", (e) => showFatalError(e.error || e.message));
window.addEventListener("unhandledrejection", (e) => showFatalError(e.reason));
function showFatalError(err) {
  console.error(err);
  let bar = document.getElementById("__fatalErrorBar");
  if (bar) return; // only show the first one, avoid spam
  bar = document.createElement("div");
  bar.id = "__fatalErrorBar";
  bar.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#B23C3C;color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;z-index:9999;font-family:sans-serif;display:flex;justify-content:space-between;align-items:center;gap:12px;";
  const msg = (err && err.message) ? err.message : String(err);
  bar.innerHTML = "<span>Something broke on this page: " + msg.replace(/</g,"&lt;") + "</span>";
  const btn = document.createElement("button");
  btn.textContent = "Dismiss";
  btn.style.cssText = "background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:700;flex-shrink:0;";
  btn.onclick = () => bar.remove();
  bar.appendChild(btn);
  document.body.appendChild(bar);
}

const app = document.getElementById("app");

if (!CONFIGURED) {
  app.innerHTML = `
    <div class="setup-screen"><div class="setup-card">
      <div class="icon">&#9881;</div>
      <h2>Dashboard not connected yet</h2>
      <p>This page is working correctly — it just needs your Firebase project's keys before it can sign anyone in.</p>
      <ol>
        <li>Open <code>login.html</code> (this file) in your code editor</li>
        <li>Find the block that starts with <code>const firebaseConfig = {</code></li>
        <li>Replace all six <code>REPLACE_ME</code> values with your real Firebase config (see README.md, Step 4)</li>
        <li>Do the same in <code>agent.html</code> and <code>master.html</code></li>
        <li>Save and re-upload to GitHub</li>
      </ol>
      <p style="margin-bottom:0;">Once that's done, this screen is replaced automatically by the real sign-in page.</p>
    </div></div>`;
} else {
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  app.innerHTML = `
    <div class="wrap">
      <div class="panel-left">
        <div class="top">
          <div class="brandmark">
            <div class="box"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="11" fill="none" stroke="#CBA05C" stroke-width=".8" opacity=".7"/><path d="M8 15.5 L16 15.5 L14.5 18 L9.5 18 Z" fill="#EAD9AE"/><line x1="11.6" y1="15.5" x2="11.6" y2="6.5" stroke="#EAD9AE" stroke-width=".9"/><path d="M11.6 6.5 L11.6 15 L15.6 13 Z" fill="#CBA05C"/></svg></div>
            <div class="word">WAYFINDER</div>
          </div>
          <h1>The operating system<br/>behind every agent's<br/><em>first 90 days.</em></h1>
          <p>One place to track every step of onboarding — application, licensing, branding, and go-live — built by Skalvya for the Wayfinder team.</p>
        </div>
        <div class="bottom">
          <div class="stat"><div class="n">4</div><div class="l">ONBOARDING PHASES</div></div>
          <div class="stat"><div class="n">23</div><div class="l">TRACKED TASKS</div></div>
          <div class="stat"><div class="n">Live</div><div class="l">REAL-TIME SYNC</div></div>
        </div>
      </div>

      <div class="panel-right">
        <div class="form-card">
          <div class="eyebrow">Skalvya × Wayfinder</div>
          <h2>Welcome back</h2>
          <p class="sub">Sign in with the email and password Skalvya set up for you.</p>

          <div id="loginError" class="login-error"></div>

          <form id="loginForm">
            <div class="field">
              <label>Email</label>
              <input type="email" id="email" required autocomplete="username" placeholder="you@example.com" />
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
            </div>
            <button type="submit" id="loginBtn" class="login-btn">
              <span class="spinner"></span><span class="btn-text">Sign In</span>
            </button>
          </form>
          <div class="login-footer">Trouble signing in? Message Skalvya on Slack.</div>
        </div>
      </div>
    </div>`;

  auth.onAuthStateChanged((user) => { if (user) routeByRole(user.uid); });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("loginError");
    errorBox.classList.remove("show");
    btn.disabled = true; btn.classList.add("loading");
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      await routeByRole(cred.user.uid);
    } catch (err) {
      errorBox.textContent = friendlyError(err);
      errorBox.classList.add("show");
      btn.disabled = false; btn.classList.remove("loading");
    }
  });

  async function routeByRole(uid) {
    try {
      const snap = await db.collection("users").doc(uid).get();
      const data = snap.exists ? snap.data() : {};
      const role = ["skalvya", "agent", "tyson"].includes(data.role) ? data.role : "unknown";
      const dest = role === "agent" ? "agent.html" : "master.html";
      document.getElementById("welcomeText").textContent = "Welcome back, " + (data.name ? data.name.split(" ")[0] : "there");
      document.getElementById("welcomeOverlay").classList.add("show");
      setTimeout(() => { window.location.href = dest; }, 950);
    } catch (err) {
      const errorBox = document.getElementById("loginError");
      errorBox.textContent = "Something went wrong loading your account. Try again.";
      errorBox.classList.add("show");
    }
  }

  function friendlyError(err) {
    const code = err.code || "";
    if (code.includes("wrong-password") || code.includes("invalid-credential") || code.includes("user-not-found")) {
      return "That email or password isn't right — double check with Skalvya.";
    }
    if (code.includes("too-many-requests")) return "Too many attempts — wait a minute and try again.";
    if (code.includes("invalid-email")) return "That doesn't look like a valid email address.";
    return "Couldn't sign in. Please try again.";
  }
}
</script>
</body>
</html>
